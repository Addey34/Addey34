<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">What I build</title>
  <desc id="desc">Three areas of work: product building, interactive systems and automation.</desc>
  <rect width="1200" height="330" fill="#0B0F17"/>
  <path d="M72 1 H1128" stroke="#1C2632"/>
  <text x="72" y="62" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="720">WHAT I BUILD</text>
  <text x="1128" y="59" fill="#7C8591" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">THREE FIELDS / ONE PRACTICE</text>
  <path d="M72 88 H265" stroke="#D9AE57" stroke-width="2"/>
  <path d="M265 88 L304 78" stroke="#168CFF" stroke-width="3"/>

  <g transform="translate(72 142)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="300">01</text>
    <text x="90" y="-2" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="720" letter-spacing="1.4">BUILD</text>
    <text x="90" y="34" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Web products &amp; SaaS</text>
    <text x="90" y="64" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">Interfaces, APIs, data and production delivery.</text>
  </g>

  <g transform="translate(432 142)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="300">02</text>
    <text x="90" y="-2" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="720" letter-spacing="1.4">SIMULATE</text>
    <text x="90" y="34" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">3D, games &amp; realtime</text>
    <text x="90" y="64" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">Interactive systems with motion, state and space.</text>
  </g>

  <g transform="translate(792 142)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="300">03</text>
    <text x="90" y="-2" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="720" letter-spacing="1.4">AUTOMATE</text>
    <text x="90" y="34" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">AI, tooling &amp; infrastructure</text>
    <text x="90" y="64" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">Systems that observe, generate, connect and operate.</text>
  </g>

  <path d="M72 284 H388" stroke="#D9AE57" stroke-width="2"/>
  <path d="M388 284 L430 274" stroke="#168CFF" stroke-width="3"/>
  <path d="M430 274 H1128" stroke="#263140"/>
</svg>