<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">What I Build</title>
  <desc id="desc">Three enduring areas of work: products, interactive systems, and automation and infrastructure.</desc>
  <rect width="1200" height="330" rx="24" fill="#0B0F17"/>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#1D2632"/>

  <text x="72" y="58" fill="#778290" font-family="SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="3">AG // FIELD OF WORK</text>
  <text x="72" y="108" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">WHAT I BUILD</text>
  <path d="M72 130 H278" stroke="#D9AE57" stroke-width="2"/>
  <path d="M278 130 L316 121" stroke="#168CFF" stroke-width="3"/>

  <!-- BUILD -->
  <g transform="translate(72 174)">
    <text x="0" y="0" fill="#D9AE57" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">01</text>
    <text x="42" y="2" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="720" letter-spacing="1.4">BUILD</text>
    <text x="42" y="34" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Web products &amp; SaaS</text>
    <text x="42" y="61" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Interfaces, APIs, data and production delivery.</text>
    <g transform="translate(0 86)" fill="none" stroke-linejoin="miter">
      <rect x="42" y="0" width="74" height="28" stroke="#D9AE57"/>
      <rect x="54" y="10" width="74" height="28" stroke="#263140"/>
      <path d="M128 24 H166" stroke="#168CFF" stroke-width="3"/>
    </g>
  </g>

  <path d="M396 168 V288" stroke="#202A36"/>

  <!-- SIMULATE -->
  <g transform="translate(432 174)">
    <text x="0" y="0" fill="#D9AE57" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">02</text>
    <text x="42" y="2" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="720" letter-spacing="1.4">SIMULATE</text>
    <text x="42" y="34" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">3D, games &amp; realtime</text>
    <text x="42" y="61" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Interactive systems with motion, state and space.</text>
    <g transform="translate(42 86)" fill="none">
      <ellipse cx="44" cy="18" rx="44" ry="15" stroke="#D9AE57"/>
      <ellipse cx="44" cy="18" rx="24" ry="39" transform="rotate(62 44 18)" stroke="#263140"/>
      <circle cx="76" cy="8" r="4" fill="#168CFF" stroke="none"/>
    </g>
  </g>

  <path d="M756 168 V288" stroke="#202A36"/>

  <!-- AUTOMATE -->
  <g transform="translate(792 174)">
    <text x="0" y="0" fill="#D9AE57" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">03</text>
    <text x="42" y="2" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="720" letter-spacing="1.4">AUTOMATE</text>
    <text x="42" y="34" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">AI, tooling &amp; infrastructure</text>
    <text x="42" y="61" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Systems that observe, generate, connect and operate.</text>
    <g transform="translate(42 87)" fill="none">
      <path d="M0 18 H30 L40 7 H70" stroke="#D9AE57" stroke-width="2"/>
      <path d="M70 7 H106" stroke="#168CFF" stroke-width="3"/>
      <circle cx="0" cy="18" r="4" fill="#D9AE57"/>
      <circle cx="70" cy="7" r="4" fill="#168CFF"/>
      <circle cx="106" cy="7" r="4" fill="#65C7FF"/>
      <path d="M18 34 H86" stroke="#263140"/>
    </g>
  </g>
</svg>