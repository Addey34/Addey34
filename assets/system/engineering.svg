<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">How I build</title>
  <desc id="desc">An engineering workflow from idea to operation with architecture, reliability and security principles.</desc>
  <rect width="1200" height="390" fill="#0B0F17"/>
  <path d="M72 1 H1128" stroke="#1C2632"/>

  <text x="72" y="64" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="720">HOW I BUILD</text>
  <text x="1128" y="61" fill="#7C8591" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">IDEA → OPERATION</text>
  <text x="72" y="101" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">A feature is not finished when it renders. It is finished when the system can run, fail and recover predictably.</text>

  <path d="M76 183 H283" stroke="#D9AE57" stroke-width="2"/>
  <path d="M283 183 L323 173" stroke="#D9AE57" stroke-width="2"/>
  <path d="M323 173 H870" stroke="#168CFF" stroke-width="3"/>
  <path d="M870 173 H1124" stroke="#34404E" stroke-width="1.5"/>

  <g font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1.3">
    <g><circle cx="88" cy="183" r="6" fill="#D9AE57"/><text x="72" y="211" fill="#AAB2BC">IDEA</text></g>
    <g><circle cx="244" cy="183" r="6" fill="#D9AE57"/><text x="204" y="211" fill="#AAB2BC">ARCHITECT</text></g>
    <g><circle cx="374" cy="173" r="6" fill="#168CFF"/><text x="352" y="201" fill="#65C7FF">BUILD</text></g>
    <g><circle cx="505" cy="173" r="6" fill="#168CFF"/><text x="485" y="201" fill="#65C7FF">TEST</text></g>
    <g><circle cx="636" cy="173" r="6" fill="#168CFF"/><text x="610" y="201" fill="#65C7FF">SECURE</text></g>
    <g><circle cx="768" cy="173" r="6" fill="#168CFF"/><text x="747" y="201" fill="#65C7FF">SHIP</text></g>
    <g><circle cx="902" cy="173" r="6" fill="#7A8695"/><text x="870" y="201" fill="#8F99A6">MONITOR</text></g>
    <g><circle cx="1112" cy="173" r="4" fill="#465262"/><text x="1060" y="201" fill="#66717E">EVOLVE</text></g>
  </g>

  <g transform="translate(72 258)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="680">Architecture</text>
    <text x="0" y="31" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">Clear boundaries. Reusable systems. Room to grow.</text>
  </g>
  <g transform="translate(442 258)">
    <text x="0" y="0" fill="#65C7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="680">Reliability</text>
    <text x="0" y="31" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">CI gates. Tests. Smoke checks. Recovery paths.</text>
  </g>
  <g transform="translate(810 258)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="680">Security</text>
    <text x="0" y="31" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">Least privilege. Secret scanning. Dependency audits.</text>
  </g>

  <path d="M72 348 H376" stroke="#D9AE57" stroke-width="2"/>
  <path d="M376 348 L418 338" stroke="#168CFF" stroke-width="3"/>
  <path d="M418 338 H1128" stroke="#263140"/>
</svg>