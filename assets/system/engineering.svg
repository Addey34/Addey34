<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Engineering system</title>
  <desc id="desc">A visual workflow from idea to monitoring, with architecture, reliability and security as engineering principles.</desc>
  <rect width="1200" height="390" rx="24" fill="#0B0F17"/>
  <rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#1D2632"/>

  <text x="72" y="58" fill="#778290" font-family="SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="3">AG // ENGINEERING SYSTEM</text>
  <text x="72" y="105" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">FROM IDEA TO OPERATION</text>
  <text x="72" y="134" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">The feature is not finished when it renders. It is finished when the system can run, fail and recover predictably.</text>

  <!-- pipeline rail -->
  <path d="M76 207 H283" stroke="#D9AE57" stroke-width="2"/>
  <path d="M283 207 L323 197" stroke="#D9AE57" stroke-width="2"/>
  <path d="M323 197 H870" stroke="#168CFF" stroke-width="3"/>
  <path d="M870 197 H1124" stroke="#34404E" stroke-width="1.5"/>

  <g font-family="SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="1.4">
    <g><circle cx="88" cy="207" r="6" fill="#D9AE57"/><text x="72" y="235" fill="#AAB2BC">IDEA</text></g>
    <g><circle cx="244" cy="207" r="6" fill="#D9AE57"/><text x="204" y="235" fill="#AAB2BC">ARCHITECT</text></g>
    <g><circle cx="374" cy="197" r="6" fill="#168CFF"/><text x="352" y="225" fill="#65C7FF">BUILD</text></g>
    <g><circle cx="505" cy="197" r="6" fill="#168CFF"/><text x="485" y="225" fill="#65C7FF">TEST</text></g>
    <g><circle cx="636" cy="197" r="6" fill="#168CFF"/><text x="610" y="225" fill="#65C7FF">SECURE</text></g>
    <g><circle cx="768" cy="197" r="6" fill="#168CFF"/><text x="747" y="225" fill="#65C7FF">SHIP</text></g>
    <g><circle cx="902" cy="197" r="6" fill="#7A8695"/><text x="870" y="225" fill="#8F99A6">MONITOR</text></g>
    <g><circle cx="1112" cy="197" r="4" fill="#465262"/><text x="1060" y="225" fill="#66717E">EVOLVE</text></g>
  </g>

  <!-- principles -->
  <g transform="translate(72 281)">
    <path d="M0 0 H310" stroke="#263140"/>
    <text x="0" y="31" fill="#D9AE57" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">01 / ARCHITECTURE</text>
    <text x="0" y="58" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Explicit boundaries. Reusable systems. Understandable growth.</text>
  </g>
  <g transform="translate(445 281)">
    <path d="M0 0 H310" stroke="#263140"/>
    <text x="0" y="31" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">02 / RELIABILITY</text>
    <text x="0" y="58" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">CI gates. Tests. Smoke checks. Monitoring and recovery.</text>
  </g>
  <g transform="translate(818 281)">
    <path d="M0 0 H310" stroke="#263140"/>
    <text x="0" y="31" fill="#D9AE57" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">03 / SECURITY</text>
    <text x="0" y="58" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Least privilege. Secret scanning. Audits by default.</text>
  </g>
</svg>