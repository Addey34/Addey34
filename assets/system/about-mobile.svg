<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
  <title id="title">About Adrian Guichard — mobile</title>
  <desc id="desc">Mobile personal profile describing product engineering, interactive systems and reliable software delivery.</desc>
  <rect width="640" height="760" fill="#0B0F17"/>
  <path d="M44 1 H596" stroke="#1C2632"/>

  <text x="44" y="58" fill="#7C8591" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2.2">ABOUT</text>
  <text x="44" y="112" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="720">I LIKE BUILDING</text>
  <text x="44" y="152" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="720">THE WHOLE THING.</text>

  <path d="M44 180 H242" stroke="#D9AE57" stroke-width="2"/>
  <path d="M242 180 L280 170" stroke="#168CFF" stroke-width="3"/>

  <text x="44" y="232" fill="#C3CAD3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">I’m a self-taught full-stack developer who enjoys</text>
  <text x="44" y="261" fill="#C3CAD3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">turning an idea into a complete, working product.</text>
  <text x="44" y="304" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Interface, backend, architecture, testing, delivery</text>
  <text x="44" y="330" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">and reliability all belong to the same craft.</text>

  <g transform="translate(44 398)">
    <text x="0" y="0" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="680">Product engineering</text>
    <text x="0" y="34" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Complete web products, clear UX, useful systems.</text>
    <path d="M0 74 H552" stroke="#263140"/>
  </g>

  <g transform="translate(44 520)">
    <text x="0" y="0" fill="#65C7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="680">Interactive systems</text>
    <text x="0" y="34" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">3D, realtime, games, simulation and rich interfaces.</text>
    <path d="M0 74 H552" stroke="#263140"/>
  </g>

  <g transform="translate(44 642)">
    <text x="0" y="0" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="680">Reliable delivery</text>
    <text x="0" y="34" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Architecture, tests, security, CI and hardening.</text>
  </g>
</svg>