<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Current toolkit</title>
  <desc id="desc">Current interface, backend, data and delivery tools used across Adrian Guichard's products.</desc>
  <rect width="1200" height="340" fill="#06080D"/>
  <path d="M72 1 H1128" stroke="#1C2632"/>

  <text x="72" y="64" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="720">CURRENT TOOLKIT</text>
  <text x="1128" y="61" fill="#7C8591" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">TOOLS CHANGE / PRINCIPLES STAY</text>
  <path d="M72 90 H256" stroke="#D9AE57" stroke-width="2"/>
  <path d="M256 90 L294 80" stroke="#168CFF" stroke-width="3"/>

  <g transform="translate(72 152)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="680">Interface</text>
    <text x="0" y="42" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">TypeScript · React · Three.js</text>
    <text x="0" y="72" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Canvas / WebGL · Vite</text>
  </g>
  <g transform="translate(350 152)">
    <text x="0" y="0" fill="#65C7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="680">Backend &amp; realtime</text>
    <text x="0" y="42" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Node.js · Express · FastAPI</text>
    <text x="0" y="72" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">REST · WebSocket · Nakama</text>
  </g>
  <g transform="translate(650 152)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="680">Data</text>
    <text x="0" y="42" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">PostgreSQL · MongoDB</text>
    <text x="0" y="72" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Storage follows product needs.</text>
  </g>
  <g transform="translate(888 152)">
    <text x="0" y="0" fill="#65C7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="680">Delivery &amp; quality</text>
    <text x="0" y="42" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Docker · Linux · GitHub Actions</text>
    <text x="0" y="72" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">pnpm · Playwright · Vitest · Gitleaks</text>
  </g>

  <path d="M72 298 H394" stroke="#D9AE57" stroke-width="2"/>
  <path d="M394 298 L436 288" stroke="#168CFF" stroke-width="3"/>
  <path d="M436 288 H1128" stroke="#263140"/>
</svg>