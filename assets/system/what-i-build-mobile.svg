    <text x="44" y="4" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="720">BUILD</text>
    <text x="44" y="40" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Web products &amp; SaaS</text>
    <text x="44" y="72" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Interfaces, APIs, data and production delivery.</text>
    <path d="M0 118 H552" stroke="#263140"/>
  </g>

  <g transform="translate(44 352)">
