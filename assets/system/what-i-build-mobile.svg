<svg xmlns="http://www.w3.org/2000/svg" width="640" height="740" viewBox="0 0 640 740" role="img" aria-labelledby="title desc">
  <title id="title">What I build — mobile</title>
  <desc id="desc">Mobile overview of three fields: product building, interactive systems and automation.</desc>
  <rect width="640" height="740" fill="#0B0F17"/>
  <path d="M44 1 H596" stroke="#1C2632"/>
