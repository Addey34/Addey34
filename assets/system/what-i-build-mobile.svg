    <text x="44" y="4" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="720">SIMULATE</text>
    <text x="44" y="40" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">3D, games &amp; realtime</text>
    <text x="44" y="72" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Interactive systems with motion, state and space.</text>
