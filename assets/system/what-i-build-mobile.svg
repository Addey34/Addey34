<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title desc">
  <title id="title">What I Build — mobile</title>
  <desc id="desc">Mobile overview of product, interactive-system and automation work.</desc>
  <rect width="640" height="790" rx="24" fill="#0B0F17"/>
  <rect x="1" y="1" width="638" height="788" rx="23" fill="none" stroke="#1D2632"/>
