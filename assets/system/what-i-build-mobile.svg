    <path d="M0 112 H552" stroke="#263140"/>
  </g>

  <g transform="translate(44 340)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="300">02</text>
    <text x="94" y="-2" fill="#F2D58A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720">SIMULATE</text>
    <text x="94" y="35" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">3D, games &amp; realtime</text>
    <text x="94" y="67" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Motion, state, space, realtime.</text>
