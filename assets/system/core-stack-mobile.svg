<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">Current toolkit — mobile</title>
  <desc id="desc">Mobile overview of interface, backend, data and delivery tools.</desc>
  <rect width="640" height="720" fill="#06080D"/>
  <path d="M44 1 H596" stroke="#1C2632"/>
  <text x="44" y="64" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="720">CURRENT TOOLKIT</text>
  <path d="M44 90 H236" stroke="#D9AE57" stroke-width="2"/>
  <path d="M236 90 L274 80" stroke="#168CFF" stroke-width="3"/>

  <g transform="translate(44 150)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="680">Interface</text>
    <text x="0" y="39" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">TypeScript · React · Three.js</text>
    <text x="0" y="69" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Canvas / WebGL · Vite</text>
    <path d="M0 106 H552" stroke="#263140"/>
  </g>
  <g transform="translate(44 300)">
    <text x="0" y="0" fill="#65C7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="680">Backend &amp; realtime</text>
    <text x="0" y="39" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Node.js · Express · FastAPI</text>
    <text x="0" y="69" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">REST · WebSocket · Nakama</text>
    <path d="M0 106 H552" stroke="#263140"/>
  </g>
  <g transform="translate(44 450)">
    <text x="0" y="0" fill="#D9AE57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="680">Data</text>
    <text x="0" y="39" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">PostgreSQL · MongoDB</text>
    <path d="M0 106 H552" stroke="#263140"/>
  </g>
  <g transform="translate(44 590)">
    <text x="0" y="0" fill="#65C7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="680">Delivery &amp; quality</text>
    <text x="0" y="39" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Docker · Linux · GitHub Actions</text>
    <text x="0" y="69" fill="#9AA4B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">pnpm · Playwright · Vitest · Gitleaks</text>
  </g>
