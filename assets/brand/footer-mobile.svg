<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">Adrian Guichard signature — mobile</title>
  <desc id="desc">Mobile AG signature with the phrase From idea to running system.</desc>
  <rect width="640" height="380" rx="24" fill="#06080D"/>
  <rect x="1" y="1" width="638" height="378" rx="23" fill="none" stroke="#1D2632"/>
  <g transform="translate(40 46) scale(.75)">
    <g fill="none" stroke="#D9AE57" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M116 40 A52 52 0 1 0 126 102" stroke-width="11"/>
      <path d="M47 119 L79 38 L108 119" stroke-width="11"/>
      <path d="M61 88 H126" stroke-width="9"/>
    </g>
  </g>
  <text x="178" y="84" fill="#778290" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2.2">AG // SIGNATURE</text>
  <text x="178" y="128" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="720">FROM IDEA</text>
  <text x="178" y="163" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="720">TO RUNNING SYSTEM.</text>
  <text x="44" y="238" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Adrian Guichard · Full-stack development</text>
  <text x="44" y="266" fill="#8F99A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Products · interactive systems</text>
  <path d="M44 314 H262" stroke="#D9AE57" stroke-width="2"/>
