<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">AG signal line</title>
  <desc id="desc">A restrained gold structural line interrupted by an electric-blue active signal and a fourteen-degree cut.</desc>
  <rect width="1200" height="120" fill="#06080D"/>
  <path d="M72 60 H462" stroke="#D9AE57" stroke-width="2"/>
  <path d="M462 60 L506 49" stroke="#D9AE57" stroke-width="2"/>
  <path d="M506 49 H712" stroke="#168CFF" stroke-width="3"/>
  <circle cx="712" cy="49" r="4.5" fill="#65C7FF"/>
  <path d="M722 49 H1128" stroke="#263140" stroke-width="1"/>
  <text x="72" y="42" fill="#98A1AE" font-family="SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2.4">AG // STRUCTURE</text>
  <text x="520" y="35" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2.4">SIGNAL</text>
</svg>