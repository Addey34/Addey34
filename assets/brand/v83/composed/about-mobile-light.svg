<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc"><title id="title">About Adrian mobile</title><desc id="desc">Mobile Signal About section with dedicated path module.</desc><rect width="640" height="560" fill="#F4F1E8"/><path d="M30 0 V560" stroke="#CDD2D8" stroke-width="2"/><circle cx="30" cy="38" r="6" fill="#9A6C17"/><path d="M30 38 H62" stroke="#9A6C17" stroke-width="2"/><text x="74" y="40" fill="#B9821E" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".9">00</text><text x="74" y="82" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="790" >ABOUT</text><text x="604" y="82" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" text-anchor="end" letter-spacing=".7">SELF-TAUGHT · FULL-STACK JS / TS</text><path d="M30 100 V536" stroke="#CDD2D8" stroke-width="2"/><circle cx="30" cy="148" r="4" fill="#9A6C17"/><path d="M30 148 H54" stroke="#9A6C17" stroke-width="1.5"/><rect x="54" y="116" width="532" height="96" fill="#FFFFFF" stroke="#CDD2D8"/><text x="76" y="144" fill="#B9821E" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".6">01 · ROLE</text><text x="76" y="178" fill="#343C47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="560" >Self-taught full-stack JavaScript / TypeScript developer</text><circle cx="30" cy="262" r="4" fill="#006BDD"/><path d="M30 262 H54" stroke="#006BDD" stroke-width="1.5"/><rect x="54" y="230" width="532" height="84" fill="#FFFFFF" stroke="#CDD2D8"/><text x="76" y="258" fill="#168CFF" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".6">02 · LOCATION</text><text x="76" y="292" fill="#343C47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="560" >Montpellier, France</text><circle cx="30" cy="364" r="4" fill="#9A6C17"/><path d="M30 364 H54" stroke="#9A6C17" stroke-width="1.5"/><rect x="54" y="332" width="532" height="92" fill="#FFFFFF" stroke="#CDD2D8"/><text x="76" y="360" fill="#B9821E" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".6">03 · SCOPE</text><text x="76" y="394" fill="#343C47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="560" >Frontend · Backend · Data · Testing · Security · Delivery</text><circle cx="30" cy="482" r="4" fill="#9A6C17"/><path d="M30 482 H54" stroke="#9A6C17" stroke-width="1.5"/><rect x="54" y="442" width="532" height="92" fill="#ECE9E0" stroke="#CDD2D8"/><text x="76" y="470" fill="#B9821E" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".6">04 · PATH</text><text x="76" y="500" fill="#343C47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" >Started with frontend, then expanded toward</text><text x="76" y="522" fill="#343C47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" >the layers behind the product.</text></svg>