<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc"><title id="title">Build workflow</title><desc id="desc">Tighter Signal workflow with stronger step hierarchy.</desc><rect width="1120" height="230" fill="#F4F1E8"/><path d="M36 0 V230" stroke="#CDD2D8" stroke-width="2"/><circle cx="36" cy="40" r="6" fill="#006BDD"/><path d="M36 40 H68" stroke="#006BDD" stroke-width="2"/><text x="80" y="42" fill="#168CFF" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing=".9">30</text><text x="80" y="82" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="790" >WORKFLOW</text><text x="1078" y="80" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="650" text-anchor="end" letter-spacing=".7">IDEA → DESIGN → BUILD → TEST → SECURE → SHIP → IMPROVE</text><path d="M72 157 H1050" stroke="#CDD2D8" stroke-width="2"/><circle cx="134" cy="157" r="6" fill="#9A6C17"/><rect x="72" y="118" width="124" height="78" fill="#FFFFFF" stroke="#CDD2D8"/><text x="86" y="138" fill="#B9821E" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing=".5">31</text><text x="86" y="167" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="735" >IDEA</text><text x="86" y="187" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" letter-spacing=".4">CLARIFY</text><circle cx="276" cy="157" r="6" fill="#9A6C17"/><rect x="214" y="118" width="124" height="78" fill="#FFFFFF" stroke="#CDD2D8"/><text x="228" y="138" fill="#B9821E" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing=".5">32</text><text x="228" y="167" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="735" >DESIGN</text><text x="228" y="187" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" letter-spacing=".4">STRUCTURE</text><circle cx="418" cy="157" r="6" fill="#006BDD"/><rect x="356" y="118" width="124" height="78" fill="#FFFFFF" stroke="#CDD2D8"/><text x="370" y="138" fill="#168CFF" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing=".5">33</text><text x="370" y="167" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="735" >BUILD</text><text x="370" y="187" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" letter-spacing=".4">IMPLEMENT</text><circle cx="560" cy="157" r="6" fill="#006BDD"/><rect x="498" y="118" width="124" height="78" fill="#FFFFFF" stroke="#CDD2D8"/><text x="512" y="138" fill="#168CFF" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing=".5">34</text><text x="512" y="167" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="735" >TEST</text><text x="512" y="187" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" letter-spacing=".4">VERIFY</text><circle cx="702" cy="157" r="6" fill="#006BDD"/><rect x="640" y="118" width="124" height="78" fill="#FFFFFF" stroke="#CDD2D8"/><text x="654" y="138" fill="#168CFF" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing=".5">35</text><text x="654" y="167" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="735" >SECURE</text><text x="654" y="187" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" letter-spacing=".4">HARDEN</text><circle cx="844" cy="157" r="6" fill="#006BDD"/><rect x="782" y="118" width="124" height="78" fill="#FFFFFF" stroke="#CDD2D8"/><text x="796" y="138" fill="#168CFF" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing=".5">36</text><text x="796" y="167" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="735" >SHIP</text><text x="796" y="187" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" letter-spacing=".4">DELIVER</text><circle cx="986" cy="157" r="6" fill="#9A6C17"/><rect x="924" y="118" width="124" height="78" fill="#FFFFFF" stroke="#CDD2D8"/><text x="938" y="138" fill="#B9821E" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing=".5">37</text><text x="938" y="167" fill="#0B0E14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="735" >IMPROVE</text><text x="938" y="187" fill="#586170" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" letter-spacing=".4">ITERATE</text></svg>