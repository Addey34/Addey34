<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc"><title id="title">About Adrian mobile</title><desc id="desc">Mobile Signal About section with dedicated path module.</desc><rect width="640" height="560" fill="#06080D"/><path d="M30 0 V560" stroke="#273240" stroke-width="2"/><circle cx="30" cy="38" r="6" fill="#D9AE57"/><path d="M30 38 H62" stroke="#D9AE57" stroke-width="2"/><text x="74" y="40" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".9">00</text><text x="74" y="82" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="790" >ABOUT</text><text x="604" y="82" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" text-anchor="end" letter-spacing=".7">SELF-TAUGHT · FULL-STACK JS / TS</text><path d="M30 100 V536" stroke="#273240" stroke-width="2"/><circle cx="30" cy="148" r="4" fill="#D9AE57"/><path d="M30 148 H54" stroke="#D9AE57" stroke-width="1.5"/><rect x="54" y="116" width="532" height="96" fill="#0B0F17" stroke="#273240"/><text x="76" y="144" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".6">01 · ROLE</text><text x="76" y="178" fill="#D2D8DF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="560" >Self-taught full-stack JavaScript / TypeScript developer</text><circle cx="30" cy="262" r="4" fill="#168CFF"/><path d="M30 262 H54" stroke="#168CFF" stroke-width="1.5"/><rect x="54" y="230" width="532" height="84" fill="#0B0F17" stroke="#273240"/><text x="76" y="258" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".6">02 · LOCATION</text><text x="76" y="292" fill="#D2D8DF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="560" >Montpellier, France</text><circle cx="30" cy="364" r="4" fill="#D9AE57"/><path d="M30 364 H54" stroke="#D9AE57" stroke-width="1.5"/><rect x="54" y="332" width="532" height="92" fill="#0B0F17" stroke="#273240"/><text x="76" y="360" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".6">03 · SCOPE</text><text x="76" y="394" fill="#D2D8DF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="560" >Frontend · Backend · Data · Testing · Security · Delivery</text><circle cx="30" cy="482" r="4" fill="#D9AE57"/><path d="M30 482 H54" stroke="#D9AE57" stroke-width="1.5"/><rect x="54" y="442" width="532" height="92" fill="#101722" stroke="#273240"/><text x="76" y="470" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing=".6">04 · PATH</text><text x="76" y="500" fill="#D2D8DF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" >Started with frontend, then expanded toward</text><text x="76" y="522" fill="#D2D8DF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" >the layers behind the product.</text></svg>