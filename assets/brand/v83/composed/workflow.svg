<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc"><title id="title">Build workflow</title><desc id="desc">Compact continuous workflow rail.</desc><rect width="1120" height="260" fill="#06080D"/>
