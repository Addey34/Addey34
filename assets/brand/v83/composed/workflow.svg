<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="210" viewBox="0 0 1120 210" role="img" aria-labelledby="title desc"><title id="title">Build workflow</title><desc id="desc">Editorial rail-first Workflow section.</desc><rect width="1120" height="210" fill="#06080D"/>
