<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc"><title id="title">Build workflow</title><desc id="desc">Refined Signal workflow.</desc><rect width="1120" height="310" fill="#06080D"/><path d="M36 0 V310" stroke="#273240" stroke-width="2"/><circle cx="36" cy="40" r="6" fill="#D9AE57"/><path d="M36 40 H68" stroke="#D9AE57" stroke-width="2"/><text x="80" y="42" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">20</text><text x="80" y="84" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="790" >WORKFLOW</text><text x="1078" y="82" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="650" text-anchor="end" letter-spacing=".9">IDEA → DESIGN → BUILD → TEST → SECURE → SHIP → IMPROVE</text><path d="M72 198 H1050" stroke="#273240" stroke-width="2"/><circle cx="134" cy="198" r="6" fill="#D9AE57"/><rect x="72" y="144" width="124" height="104" fill="#0B0F17" stroke="#273240"/><text x="88" y="168" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing=".6">01</text><text x="88" y="201" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" font-weight="730" >IDEA</text><text x="88" y="228" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.2" font-weight="650" letter-spacing=".5">CLARIFY</text><path d="M196 198 H214" stroke="#273240" stroke-width="2"/><circle cx="276" cy="198" r="6" fill="#D9AE57"/><rect x="214" y="144" width="124" height="104" fill="#0B0F17" stroke="#273240"/><text x="230" y="168" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing=".6">02</text><text x="230" y="201" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" font-weight="730" >DESIGN</text><text x="230" y="228" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.2" font-weight="650" letter-spacing=".5">STRUCTURE</text><path d="M338 198 H356" stroke="#273240" stroke-width="2"/><circle cx="418" cy="198" r="6" fill="#168CFF"/><rect x="356" y="144" width="124" height="104" fill="#0B0F17" stroke="#273240"/><text x="372" y="168" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing=".6">03</text><text x="372" y="201" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" font-weight="730" >BUILD</text><text x="372" y="228" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.2" font-weight="650" letter-spacing=".5">IMPLEMENT</text><path d="M480 198 H498" stroke="#273240" stroke-width="2"/><circle cx="560" cy="198" r="6" fill="#168CFF"/><rect x="498" y="144" width="124" height="104" fill="#0B0F17" stroke="#273240"/><text x="514" y="168" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing=".6">04</text><text x="514" y="201" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" font-weight="730" >TEST</text><text x="514" y="228" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.2" font-weight="650" letter-spacing=".5">VERIFY</text><path d="M622 198 H640" stroke="#273240" stroke-width="2"/><circle cx="702" cy="198" r="6" fill="#168CFF"/><rect x="640" y="144" width="124" height="104" fill="#0B0F17" stroke="#273240"/><text x="656" y="168" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing=".6">05</text><text x="656" y="201" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" font-weight="730" >SECURE</text><text x="656" y="228" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.2" font-weight="650" letter-spacing=".5">HARDEN</text><path d="M764 198 H782" stroke="#273240" stroke-width="2"/><circle cx="844" cy="198" r="6" fill="#168CFF"/><rect x="782" y="144" width="124" height="104" fill="#0B0F17" stroke="#273240"/><text x="798" y="168" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing=".6">06</text><text x="798" y="201" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" font-weight="730" >SHIP</text><text x="798" y="228" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.2" font-weight="650" letter-spacing=".5">DELIVER</text><path d="M906 198 H924" stroke="#273240" stroke-width="2"/><circle cx="986" cy="198" r="6" fill="#D9AE57"/><rect x="924" y="144" width="124" height="104" fill="#0B0F17" stroke="#273240"/><text x="940" y="168" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing=".6">07</text><text x="940" y="201" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" font-weight="730" >IMPROVE</text><text x="940" y="228" fill="#96A0AD" font-family="SFMono-Regular,Consolas,monospace" font-size="10.2" font-weight="650" letter-spacing=".5">ITERATE</text></svg>