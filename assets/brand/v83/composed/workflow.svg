<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="title desc"><title id="title">Build workflow</title><desc id="desc">Signal workflow composition.</desc><rect width="1120" height="290" fill="#06080D"/><path d="M28 1 H1092" stroke="#273240"/><path d="M28 1 V92" stroke="#273240" stroke-width="2"/><circle cx="28" cy="32" r="6" fill="#D9AE57"/><path d="M28 32 H58" stroke="#D9AE57" stroke-width="2"/><text x="72" y="33" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.2">20</text><text x="72" y="78" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="780" >WORKFLOW</text><text x="1078" y="76" fill="#8F99A6" font-family="SFMono-Regular,Consolas,monospace" font-size="10" font-weight="650" text-anchor="end" letter-spacing="1">IDEA → DESIGN → BUILD → TEST → SECURE → SHIP → IMPROVE</text><rect x="72" y="126" width="126" height="112" fill="#0B0F17" stroke="#273240"/><rect x="72" y="126" width="4" height="112" fill="#D9AE57"/><circle cx="90" cy="146" r="5" fill="#D9AE57"/><text x="104" y="149" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" letter-spacing=".6">01</text><text x="88" y="190" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="720" >IDEA</text><text x="88" y="217" fill="#8F99A6" font-family="SFMono-Regular,Consolas,monospace" font-size="8.8" font-weight="650" letter-spacing=".5">CLARIFY</text><path d="M198 182 H214" stroke="#273240" stroke-width="2"/><circle cx="206" cy="182" r="3" fill="#168CFF"/><rect x="214" y="126" width="126" height="112" fill="#0B0F17" stroke="#273240"/><rect x="214" y="126" width="4" height="112" fill="#D9AE57"/><circle cx="232" cy="146" r="5" fill="#D9AE57"/><text x="246" y="149" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" letter-spacing=".6">02</text><text x="230" y="190" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="720" >DESIGN</text><text x="230" y="217" fill="#8F99A6" font-family="SFMono-Regular,Consolas,monospace" font-size="8.8" font-weight="650" letter-spacing=".5">STRUCTURE</text><path d="M340 182 H356" stroke="#273240" stroke-width="2"/><circle cx="348" cy="182" r="3" fill="#168CFF"/><rect x="356" y="126" width="126" height="112" fill="#0B0F17" stroke="#273240"/><rect x="356" y="126" width="4" height="112" fill="#168CFF"/><circle cx="374" cy="146" r="5" fill="#168CFF"/><text x="388" y="149" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" letter-spacing=".6">03</text><text x="372" y="190" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="720" >BUILD</text><text x="372" y="217" fill="#8F99A6" font-family="SFMono-Regular,Consolas,monospace" font-size="8.8" font-weight="650" letter-spacing=".5">IMPLEMENT</text><path d="M482 182 H498" stroke="#273240" stroke-width="2"/><circle cx="490" cy="182" r="3" fill="#168CFF"/><rect x="498" y="126" width="126" height="112" fill="#0B0F17" stroke="#273240"/><rect x="498" y="126" width="4" height="112" fill="#168CFF"/><circle cx="516" cy="146" r="5" fill="#168CFF"/><text x="530" y="149" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" letter-spacing=".6">04</text><text x="514" y="190" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="720" >TEST</text><text x="514" y="217" fill="#8F99A6" font-family="SFMono-Regular,Consolas,monospace" font-size="8.8" font-weight="650" letter-spacing=".5">VERIFY</text><path d="M624 182 H640" stroke="#273240" stroke-width="2"/><circle cx="632" cy="182" r="3" fill="#168CFF"/><rect x="640" y="126" width="126" height="112" fill="#0B0F17" stroke="#273240"/><rect x="640" y="126" width="4" height="112" fill="#168CFF"/><circle cx="658" cy="146" r="5" fill="#168CFF"/><text x="672" y="149" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" letter-spacing=".6">05</text><text x="656" y="190" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="720" >SECURE</text><text x="656" y="217" fill="#8F99A6" font-family="SFMono-Regular,Consolas,monospace" font-size="8.8" font-weight="650" letter-spacing=".5">HARDEN</text><path d="M766 182 H782" stroke="#273240" stroke-width="2"/><circle cx="774" cy="182" r="3" fill="#168CFF"/><rect x="782" y="126" width="126" height="112" fill="#0B0F17" stroke="#273240"/><rect x="782" y="126" width="4" height="112" fill="#168CFF"/><circle cx="800" cy="146" r="5" fill="#168CFF"/><text x="814" y="149" fill="#65C7FF" font-family="SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" letter-spacing=".6">06</text><text x="798" y="190" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="720" >SHIP</text><text x="798" y="217" fill="#8F99A6" font-family="SFMono-Regular,Consolas,monospace" font-size="8.8" font-weight="650" letter-spacing=".5">DELIVER</text><path d="M908 182 H924" stroke="#273240" stroke-width="2"/><circle cx="916" cy="182" r="3" fill="#168CFF"/><rect x="924" y="126" width="126" height="112" fill="#0B0F17" stroke="#273240"/><rect x="924" y="126" width="4" height="112" fill="#D9AE57"/><circle cx="942" cy="146" r="5" fill="#D9AE57"/><text x="956" y="149" fill="#F2D58A" font-family="SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" letter-spacing=".6">07</text><text x="940" y="190" fill="#F5F3ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="720" >IMPROVE</text><text x="940" y="217" fill="#8F99A6" font-family="SFMono-Regular,Consolas,monospace" font-size="8.8" font-weight="650" letter-spacing=".5">ITERATE</text></svg>