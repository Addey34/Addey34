<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Engineering loop</title><desc id="desc">Compact engineering loop from plan through iteration.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#0A1119"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient><path id="rail" d="M80 320C150 320 185 278 220 278S290 360 330 360S410 278 450 278S530 360 570 360S650 278 690 278S770 320 820 320"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.flow{stroke-dasharray:14 18;animation:r 8s linear infinite}.node{animation:p 6.4s ease-in-out infinite}@keyframes r{to{stroke-dashoffset:-128}}@keyframes p{0%,100%{opacity:.82}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.flow,.node{animation:none!important}}</style></defs>
<rect width="900" height="460" rx="30" fill="url(#bg)"/>
<g transform="translate(48 52)"><circle cx="7" cy="-10" r="5" fill="#D9AE57"/><text x="25" y="-4" class="m" font-size="20" fill="#D9AE57" letter-spacing="3">ENGINEERING LOOP</text><text y="50" font-size="34" font-weight="760" fill="#F5F3ED">Build, harden, observe, improve.</text><text y="82" font-size="20" fill="#98A1AE">Testing and observation stay inside the build loop.</text></g>
<use href="#rail" fill="none" stroke="#263140" stroke-width="2"/><use href="#rail" fill="none" stroke="#168CFF" stroke-opacity=".32" stroke-width="2" class="flow"/><circle class="motion-dot" r="4" fill="#65C7FF"><animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<g class="m" text-anchor="middle" font-size="20" fill="#F5F3ED">
<g transform="translate(80 320)" class="node"><polygon points="-62,0 0,-30 62,0 0,30" fill="#181713" stroke="#D9AE57"/><text y="7" fill="#F2D58A">PLAN</text></g><g transform="translate(220 278)" class="node"><polygon points="-62,0 0,-30 62,0 0,30" fill="url(#top)" stroke="#405064"/><text y="7" fill="#F5F3ED">BUILD</text></g><g transform="translate(330 360)" class="node"><polygon points="-62,0 0,-30 62,0 0,30" fill="url(#top)" stroke="#405064"/><text y="7" fill="#F5F3ED">TEST</text></g><g transform="translate(450 278)" class="node"><polygon points="-62,0 0,-30 62,0 0,30" fill="url(#top)" stroke="#168CFF"/><text y="7" fill="#65C7FF">HARDEN</text></g><g transform="translate(570 360)" class="node"><polygon points="-62,0 0,-30 62,0 0,30" fill="url(#top)" stroke="#405064"/><text y="7" fill="#F5F3ED">DEPLOY</text></g><g transform="translate(690 278)" class="node"><polygon points="-62,0 0,-30 62,0 0,30" fill="url(#top)" stroke="#405064"/><text y="7" fill="#F5F3ED">MONITOR</text></g><g transform="translate(820 320)" class="node"><polygon points="-62,0 0,-30 62,0 0,30" fill="#181713" stroke="#D9AE57"/><text y="7" fill="#F2D58A">ITERATE</text></g>
</g>
</svg>