<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc">
<title id="title">Core technical stack</title>
<desc id="desc">Mobile technical stack grouped by role.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#08121B"/></linearGradient>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
<path id="rail" d="M360 310V1050"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.rail{stroke-dasharray:16 20;animation:r 8s linear infinite}@keyframes r{to{stroke-dashoffset:-144}}@media(prefers-reduced-motion:reduce){.rail{animation:none!important}}</style>
</defs>
<rect width="720" height="1140" rx="32" fill="url(#bg)"/>
<g transform="translate(54 60)">
<circle cx="7" cy="-12" r="6" fill="#D9AE57"/><text x="26" y="-5" class="m" font-size="19" fill="#D9AE57" letter-spacing="3">CORE STACK</text>
<text y="54" font-size="34" font-weight="760" fill="#F5F3ED">Tools grouped by technical role.</text>
<text y="91" font-size="20" fill="#98A1AE">Core first; supporting experience stays in the README.</text>
</g>
<g transform="translate(360 230)">
<polygon points="-120,0 0,-62 120,0 0,62" fill="#181713" stroke="#D9AE57"/>
<polygon points="-120,0 0,62 0,92 -120,30" fill="#0A0B0E" stroke="#3A3021"/>
<polygon points="0,62 120,0 120,30 0,92" fill="#08090B" stroke="#3A3021"/>
<text y="7" text-anchor="middle" font-size="29" font-weight="800" fill="#F2D58A">BUILD CORE</text>
</g>
<use href="#rail" stroke="#263140" stroke-width="2"/><use href="#rail" stroke="#168CFF" stroke-opacity=".28" stroke-width="2" class="rail"/>
<g text-anchor="middle">
<g transform="translate(360 380)"><polygon points="-285,0 0,-50 285,0 0,50" fill="url(#plate)" stroke="#405064"/><text y="-10" class="m" font-size="18" fill="#D9AE57">LANGUAGES</text><text y="17" font-size="24" font-weight="750" fill="#F5F3ED">TypeScript · JavaScript · Python</text></g>
<g transform="translate(360 510)"><polygon points="-285,0 0,-50 285,0 0,50" fill="url(#plate)" stroke="#405064"/><text y="-10" class="m" font-size="18" fill="#65C7FF">PRODUCT RUNTIME</text><text y="17" font-size="23" font-weight="750" fill="#F5F3ED">React · Node.js · Express · Vite</text></g>
<g transform="translate(360 640)"><polygon points="-285,0 0,-50 285,0 0,50" fill="url(#plate)" stroke="#405064"/><text y="-10" class="m" font-size="18" fill="#65C7FF">REALTIME / GRAPHICS</text><text y="17" font-size="22" font-weight="750" fill="#F5F3ED">Three.js · WebGL · WebSocket · Nakama</text></g>
<g transform="translate(360 770)"><polygon points="-285,0 0,-50 285,0 0,50" fill="url(#plate)" stroke="#405064"/><text y="-10" class="m" font-size="18" fill="#65C7FF">BACKEND / DATA</text><text y="17" font-size="22" font-weight="750" fill="#F5F3ED">MongoDB · PostgreSQL · REST · JWT / OAuth</text></g>
<g transform="translate(360 900)"><polygon points="-285,0 0,-50 285,0 0,50" fill="url(#plate)" stroke="#405064"/><text y="-10" class="m" font-size="18" fill="#65C7FF">AI / COMPUTE</text><text y="17" font-size="22" font-weight="750" fill="#F5F3ED">FastAPI · PyTorch · ONNX · CUDA / DirectML</text></g>
<g transform="translate(360 1030)"><polygon points="-285,0 0,-50 285,0 0,50" fill="url(#plate)" stroke="#405064"/><text y="-10" class="m" font-size="18" fill="#65C7FF">DELIVERY / QA</text><text y="17" font-size="21" font-weight="750" fill="#F5F3ED">Playwright · Vitest · Jest · Docker · Actions</text></g>
</g>
<circle r="5" fill="#65C7FF"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<circle r="4" fill="#D9AE57"><animateMotion dur="9s" begin="-4s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
</svg>