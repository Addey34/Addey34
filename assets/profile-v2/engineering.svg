<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img"><title>Engineering loop</title><desc>Animated engineering pipeline from plan and build through testing, hardening, deployment, monitoring and iteration.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#0A1119"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient><path id="rail" d="M105 235C190 180 255 180 340 235S490 290 575 235S725 180 810 235S960 290 1095 235"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.s{animation:p 4.8s ease-in-out infinite}.x2{animation-delay:-.6s}.x3{animation-delay:-1.2s}.x4{animation-delay:-1.8s}.x5{animation-delay:-2.4s}.x6{animation-delay:-3s}.x7{animation-delay:-3.6s}.flow{stroke-dasharray:14 18;animation:r 6s linear infinite}@keyframes p{50%{opacity:1}0%,100%{opacity:.75}}@keyframes r{to{stroke-dashoffset:-128}}@media(prefers-reduced-motion:reduce){.s,.flow{animation:none!important}}</style></defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/><g transform="translate(72 58)"><circle cx="7" cy="-10" r="5" fill="#D9AE57"/><text x="24" y="-5" class="m" font-size="12" fill="#D9AE57" letter-spacing="3">ENGINEERING LOOP</text><text y="43" font-size="30" font-weight="760" fill="#F5F3ED">Build, harden, observe, improve.</text><text y="70" font-size="14" fill="#98A1AE">A product is not finished when it first works.</text></g>
<use href="#rail" fill="none" stroke="#263140" stroke-width="2"/><use href="#rail" fill="none" stroke="#168CFF" stroke-opacity=".4" class="flow"/>
<g class="m" text-anchor="middle" font-size="11.5" fill="#F5F3ED">
<g transform="translate(105 235)" class="s"><polygon points="-58,0 0,-31 58,0 0,31" fill="#181713" stroke="#D9AE57"/><text y="4" fill="#F2D58A">PLAN</text></g>
<g transform="translate(270 194)" class="s x2"><polygon points="-58,0 0,-31 58,0 0,31" fill="url(#top)" stroke="#405064"/><text y="4">BUILD</text></g>
<g transform="translate(425 276)" class="s x3"><polygon points="-58,0 0,-31 58,0 0,31" fill="url(#top)" stroke="#405064"/><text y="4">TEST</text></g>
<g transform="translate(575 194)" class="s x4"><polygon points="-64,0 0,-34 64,0 0,34" fill="url(#top)" stroke="#168CFF"/><text y="4" fill="#65C7FF">HARDEN</text></g>
<g transform="translate(730 276)" class="s x5"><polygon points="-62,0 0,-33 62,0 0,33" fill="url(#top)" stroke="#405064"/><text y="4">DEPLOY</text></g>
<g transform="translate(885 194)" class="s x6"><polygon points="-65,0 0,-34 65,0 0,34" fill="url(#top)" stroke="#405064"/><text y="4">MONITOR</text></g>
<g transform="translate(1095 235)" class="s x7"><polygon points="-65,0 0,-34 65,0 0,34" fill="#181713" stroke="#D9AE57"/><text y="4" fill="#F2D58A">ITERATE</text></g></g>
<circle r="5" fill="#65C7FF"><animateMotion dur="6.8s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle><circle r="3" fill="#D9AE57"><animateMotion dur="9s" begin="-4s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<text x="600" y="332" text-anchor="middle" class="m" font-size="10" fill="#667281" letter-spacing="2">PLAN → BUILD → TEST → HARDEN → DEPLOY → MONITOR → ITERATE</text></svg>