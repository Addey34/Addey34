<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Technical scope</title><desc id="desc">Animated pseudo-3D capability map spanning web, games, 3D, AI, automation, security and hardware performance.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#0A1119"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="a" d="M600 290C480 220 395 175 275 155"/><path id="b" d="M600 290C470 290 360 292 240 292"/><path id="c" d="M600 290C480 360 395 410 285 455"/><path id="d" d="M600 290C720 220 805 175 925 155"/><path id="e" d="M600 290C730 290 840 292 960 292"/><path id="f" d="M600 290C720 360 805 410 915 455"/><path id="h" d="M600 290V492"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.box{animation:f 7s ease-in-out infinite}.x2{animation-delay:-1s}.x3{animation-delay:-2s}.x4{animation-delay:-3s}.x5{animation-delay:-4s}.x6{animation-delay:-5s}.x7{animation-delay:-6s}.rail{stroke-dasharray:12 16;animation:r 7s linear infinite}@keyframes f{0%,100%{opacity:.92}50%{opacity:1}}@keyframes r{to{stroke-dashoffset:-112}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.box,.rail{animation:none!important}}</style></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<g transform="translate(72 58)"><circle cx="7" cy="-10" r="5" fill="#D9AE57"/><text x="24" y="-5" class="m" font-size="12" fill="#D9AE57" letter-spacing="3">TECHNICAL SCOPE</text><text y="43" font-size="30" font-weight="760" fill="#F5F3ED">One profile, multiple technical domains.</text><text y="70" font-size="14" fill="#98A1AE">From interface to runtime, compute, reliability and performance.</text></g>
<g fill="none" stroke="#263140" stroke-width="1.4" class="rail"><use href="#a"/><use href="#b"/><use href="#c"/><use href="#d"/><use href="#e"/><use href="#f"/><use href="#h"/></g>
<g transform="translate(600 290)"><polygon points="-110,0 0,-62 110,0 0,62" fill="#171A1C" stroke="#D9AE57"/><polygon points="-110,0 0,62 0,96 -110,34" fill="#0A0B0E" stroke="#3A3021"/><polygon points="0,62 110,0 110,34 0,96" fill="#08090B" stroke="#3A3021"/><text y="5" text-anchor="middle" font-size="28" font-weight="800" fill="#F2D58A">SYSTEMS</text><text y="28" text-anchor="middle" class="m" font-size="9.5" fill="#A7B0BC" letter-spacing="2">ARCHITECTURE / FLOW / CONSTRAINTS</text></g>
<g font-size="15" fill="#F5F3ED" text-anchor="middle">
<g transform="translate(275 155)" class="box"><polygon points="-115,0 0,-58 115,0 0,58" fill="url(#top)" stroke="#405064"/><text y="-3" font-weight="700">WEB / FULL-STACK</text><text y="19" class="m" font-size="9.5" fill="#8FA0B1">React · Node · APIs · Data</text></g>
<g transform="translate(240 292)" class="box x2"><polygon points="-115,0 0,-58 115,0 0,58" fill="url(#top)" stroke="#405064"/><text y="-3" font-weight="700">REALTIME / GAMES</text><text y="19" class="m" font-size="9.5" fill="#8FA0B1">WebSocket · Nakama · game loops</text></g>
<g transform="translate(285 455)" class="box x3"><polygon points="-115,0 0,-58 115,0 0,58" fill="url(#top)" stroke="#405064"/><text y="-3" font-weight="700">3D / GRAPHICS</text><text y="19" class="m" font-size="9.5" fill="#8FA0B1">Three.js · WebGL · Canvas</text></g>
<g transform="translate(925 155)" class="box x4"><polygon points="-115,0 0,-58 115,0 0,58" fill="url(#top)" stroke="#405064"/><text y="-3" font-weight="700">AI / LOCAL COMPUTE</text><text y="19" class="m" font-size="9.5" fill="#8FA0B1">Python · PyTorch · ONNX · CUDA</text></g>
<g transform="translate(960 292)" class="box x5"><polygon points="-115,0 0,-58 115,0 0,58" fill="url(#top)" stroke="#405064"/><text y="-3" font-weight="700">AUTOMATION / TOOLS</text><text y="19" class="m" font-size="9.5" fill="#8FA0B1">scripts · agents · workflows</text></g>
<g transform="translate(915 455)" class="box x6"><polygon points="-115,0 0,-58 115,0 0,58" fill="url(#top)" stroke="#405064"/><text y="-3" font-weight="700">SECURITY / RELIABILITY</text><text y="19" class="m" font-size="9.5" fill="#8FA0B1">testing · validation · hardening</text></g>
<g transform="translate(600 492)" class="box x7"><polygon points="-125,0 0,-54 125,0 0,54" fill="url(#top)" stroke="#405064"/><text y="-3" font-weight="700">HARDWARE / PERFORMANCE</text><text y="19" class="m" font-size="9.5" fill="#8FA0B1">GPU · runtime · profiling · constraints</text></g>
</g>
<g fill="#65C7FF" filter="url(#glow)"><circle class="motion-dot" r="3.5"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle><circle class="motion-dot" r="3.5"><animateMotion dur="5.6s" begin="-1s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle><circle class="motion-dot" r="3.5"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle><circle class="motion-dot" r="3.5"><animateMotion dur="5.2s" begin="-3s" repeatCount="indefinite"><mpath href="#d"/></animateMotion></circle><circle class="motion-dot" r="3.5"><animateMotion dur="5.8s" begin="-4s" repeatCount="indefinite"><mpath href="#e"/></animateMotion></circle><circle class="motion-dot" r="3.5"><animateMotion dur="6.2s" begin="-5s" repeatCount="indefinite"><mpath href="#f"/></animateMotion></circle><circle class="motion-dot" r="3.5"><animateMotion dur="5.4s" begin="-2.5s" repeatCount="indefinite"><mpath href="#h"/></animateMotion></circle></g>
</svg>