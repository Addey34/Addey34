<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc"><title id="title">Selected public work</title><desc id="desc">Animated project proof modules for Galaxy, Ludora and MagNotes with verified concise technology stacks.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#0A1119"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="rail" d="M120 430C155 400 180 400 215 430S565 460 600 430S950 400 985 430C1020 460 1065 460 1100 430"/><path id="b1" d="M215 353V430"/><path id="b2" d="M600 353V430"/><path id="b3" d="M985 353V430"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.card{animation:f 7s ease-in-out infinite}.c2{animation-delay:-2s}.c3{animation-delay:-4s}.trace{stroke-dasharray:13 15;animation:r 6s linear infinite}@keyframes f{0%,100%{opacity:.92}50%{opacity:1}}@keyframes r{to{stroke-dashoffset:-112}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.card,.trace{animation:none!important}}</style></defs>
<rect width="1200" height="575" rx="28" fill="url(#bg)"/><g transform="translate(72 58)"><circle cx="7" cy="-10" r="5" fill="#D9AE57"/><text x="24" y="-5" class="mono" font-size="12" fill="#D9AE57" letter-spacing="3">SELECTED WORK</text><text y="43" font-size="30" font-weight="760" fill="#F5F3ED">Three public projects across different technical constraints.</text><text y="70" font-size="14" fill="#98A1AE">3D graphics · realtime platform systems · full-stack product engineering.</text></g>
<g fill="none" stroke="#263140" stroke-width="2"><use href="#rail"/><use href="#b1"/><use href="#b2"/><use href="#b3"/></g><use href="#rail" fill="none" stroke="#168CFF" stroke-opacity=".35" class="trace"/>
<g filter="url(#glow)"><circle class="motion-dot" r="4" fill="#65C7FF"><animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle><circle class="motion-dot" r="3.4" fill="#D9AE57"><animateMotion dur="10s" begin="-5s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle></g>
<g transform="translate(215 275)" class="card"><polygon points="-150,0 0,-78 150,0 0,78" fill="url(#top)" stroke="#405064"/><circle cx="0" cy="-24" r="20" fill="none" stroke="#168CFF"/><ellipse cx="0" cy="-24" rx="58" ry="20" fill="none" stroke="#405064"/><text y="18" text-anchor="middle" font-size="23" font-weight="800" fill="#F5F3ED">GALAXY</text><text y="43" text-anchor="middle" class="mono" font-size="9.5" fill="#65C7FF">3D / GRAPHICS / SCIENTIFIC INTERACTION</text><text y="64" text-anchor="middle" class="mono" font-size="10" fill="#98A1AE">TypeScript · JavaScript · Three.js · WebGL</text></g>
<g transform="translate(600 275)" class="card c2"><polygon points="-150,0 0,-78 150,0 0,78" fill="url(#top)" stroke="#405064"/><g transform="translate(-55 -42)" fill="#152435" stroke="#168CFF"><rect width="28" height="28" rx="5"/><rect x="38" width="28" height="28" rx="5"/><rect x="76" width="28" height="28" rx="5"/></g><text y="18" text-anchor="middle" font-size="23" font-weight="800" fill="#F5F3ED">LUDORA</text><text y="43" text-anchor="middle" class="mono" font-size="9.5" fill="#65C7FF">GAMES / REALTIME / PLATFORM SYSTEMS</text><text y="64" text-anchor="middle" class="mono" font-size="9.6" fill="#98A1AE">TypeScript · JavaScript · Three.js · Nakama · WebSocket</text></g>
<g transform="translate(985 275)" class="card c3"><polygon points="-150,0 0,-78 150,0 0,78" fill="url(#top)" stroke="#405064"/><g transform="translate(-48 -43) rotate(-6)"><rect width="70" height="44" rx="6" fill="#111D2A" stroke="#405064"/><path d="M10 13h45M10 23h36M10 33h42" stroke="#168CFF"/></g><text y="18" text-anchor="middle" font-size="23" font-weight="800" fill="#F5F3ED">MAGNOTES</text><text y="43" text-anchor="middle" class="mono" font-size="9.5" fill="#65C7FF">PRODUCT / FULL-STACK / INTERACTION</text><text y="64" text-anchor="middle" class="mono" font-size="10" fill="#98A1AE">TypeScript · React · Node.js / Express · MongoDB</text></g>


</svg>