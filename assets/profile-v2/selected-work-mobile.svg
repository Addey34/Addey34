<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc">
<title id="title">Selected public work</title>
<desc id="desc">Mobile project modules for Galaxy, Ludora and MagNotes.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#0A1119"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
<path id="rail" d="M360 300V930"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.flow{stroke-dasharray:16 20;animation:r 8s linear infinite}.c{animation:o 7.2s ease-in-out infinite}@keyframes r{to{stroke-dashoffset:-144}}@keyframes o{0%,100%{opacity:.92}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.flow,.c{animation:none!important}}</style>
</defs>
<rect width="720" height="1050" rx="32" fill="url(#bg)"/>
<g transform="translate(54 60)">
<circle cx="7" cy="-12" r="6" fill="#D9AE57"/><text x="26" y="-5" class="m" font-size="19" fill="#D9AE57" letter-spacing="3">SELECTED WORK</text>
<text y="54" font-size="34" font-weight="760" fill="#F5F3ED">Three public projects.</text>
<text y="91" font-size="20" fill="#98A1AE">3D · realtime platform systems · full-stack product</text>
</g>
<use href="#rail" fill="none" stroke="#263140" stroke-width="2"/><use href="#rail" fill="none" stroke="#168CFF" stroke-opacity=".28" stroke-width="2" class="flow"/>
<circle class="motion-dot" r="5" fill="#65C7FF"><animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<g text-anchor="middle">
<g transform="translate(360 330)" class="c">
<polygon points="-290,0 0,-108 290,0 0,108" fill="url(#top)" stroke="#405064"/>
<circle cx="0" cy="-42" r="22" fill="none" stroke="#168CFF"/><ellipse cx="0" cy="-42" rx="64" ry="22" fill="none" stroke="#405064"/>
<text y="24" font-size="34" font-weight="800" fill="#F5F3ED">GALAXY</text>
<text y="56" class="m" font-size="18" fill="#65C7FF">3D / GRAPHICS / SCIENTIFIC INTERACTION</text>
<text y="82" class="m" font-size="19" fill="#98A1AE">TypeScript · JavaScript · Three.js · WebGL</text>
</g>
<g transform="translate(360 620)" class="c">
<polygon points="-290,0 0,-108 290,0 0,108" fill="url(#top)" stroke="#405064"/>
<g transform="translate(-68 -65)" fill="#152435" stroke="#168CFF"><rect width="34" height="34" rx="6"/><rect x="46" width="34" height="34" rx="6"/><rect x="92" width="34" height="34" rx="6"/></g>
<text y="24" font-size="34" font-weight="800" fill="#F5F3ED">LUDORA</text>
<text y="56" class="m" font-size="18" fill="#65C7FF">GAMES / REALTIME / PLATFORM SYSTEMS</text>
<text y="82" class="m" font-size="18" fill="#98A1AE">TypeScript · JavaScript · Three.js · Nakama · WebSocket</text>
</g>
<g transform="translate(360 910)" class="c">
<polygon points="-290,0 0,-108 290,0 0,108" fill="url(#top)" stroke="#405064"/>
<g transform="translate(-46 -67) rotate(-5)"><rect width="92" height="54" rx="7" fill="#111D2A" stroke="#405064"/><path d="M13 16h58M13 28h48M13 40h55" stroke="#168CFF"/></g>
<text y="24" font-size="34" font-weight="800" fill="#F5F3ED">MAGNOTES</text>
<text y="56" class="m" font-size="18" fill="#65C7FF">PRODUCT / FULL-STACK / INTERACTION</text>
<text y="82" class="m" font-size="18" fill="#98A1AE">TypeScript · React · Node.js / Express · MongoDB</text>
</g>
</g>

</svg>