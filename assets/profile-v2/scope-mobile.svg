<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
<title id="title">Technical scope</title>
<desc id="desc">Mobile capability map spanning web, realtime, 3D, AI, automation, security and hardware performance.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#0A1119"/></linearGradient>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
<path id="rail" d="M360 278V1190"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.rail{stroke-dasharray:16 20;animation:r 8s linear infinite}.b{animation:o 6s ease-in-out infinite}.d2{animation-delay:-1s}.d3{animation-delay:-2s}.d4{animation-delay:-3s}.d5{animation-delay:-4s}.d6{animation-delay:-5s}@keyframes r{to{stroke-dashoffset:-144}}@keyframes o{0%,100%{opacity:.93}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.rail,.b{animation:none!important}}</style>
</defs>
<rect width="720" height="1280" rx="32" fill="url(#bg)"/>
<g transform="translate(54 60)">
<circle cx="7" cy="-12" r="6" fill="#D9AE57"/><text x="26" y="-5" class="m" font-size="19" fill="#D9AE57" letter-spacing="3">TECHNICAL SCOPE</text>
<text y="54" font-size="36" font-weight="760" fill="#F5F3ED">Multiple technical domains.</text>
<text y="91" font-size="21" fill="#98A1AE">Connected across product, runtime and delivery.</text>
</g>
<g transform="translate(360 222)">
<polygon points="-126,0 0,-66 126,0 0,66" fill="#171A1C" stroke="#D9AE57"/>
<polygon points="-126,0 0,66 0,98 -126,32" fill="#0A0B0E" stroke="#3A3021"/>
<polygon points="0,66 126,0 126,32 0,98" fill="#08090B" stroke="#3A3021"/>
<text y="7" text-anchor="middle" font-size="33" font-weight="800" fill="#F2D58A">SYSTEMS</text>
<text y="39" text-anchor="middle" class="m" font-size="16" fill="#A7B0BC">CORE · CONNECTION · DELIVERY</text>
</g>
<use href="#rail" stroke="#263140" stroke-width="2"/>
<use href="#rail" stroke="#168CFF" stroke-opacity=".28" stroke-width="2" class="rail"/>
<g text-anchor="middle">
<g transform="translate(360 390)" class="b"><polygon points="-285,0 0,-52 285,0 0,52" fill="url(#plate)" stroke="#405064"/><text y="-5" font-size="25" font-weight="750" fill="#F5F3ED">WEB / FULL-STACK</text><text y="27" class="m" font-size="18" fill="#98A1AE">React · Node · APIs · Data</text></g>
<g transform="translate(360 525)" class="b d2"><polygon points="-285,0 0,-52 285,0 0,52" fill="url(#plate)" stroke="#405064"/><text y="-5" font-size="25" font-weight="750" fill="#F5F3ED">REALTIME / GAMES</text><text y="27" class="m" font-size="18" fill="#98A1AE">WebSocket · Nakama · game loops</text></g>
<g transform="translate(360 660)" class="b d3"><polygon points="-285,0 0,-52 285,0 0,52" fill="url(#plate)" stroke="#405064"/><text y="-5" font-size="25" font-weight="750" fill="#F5F3ED">3D / GRAPHICS</text><text y="27" class="m" font-size="18" fill="#98A1AE">Three.js · WebGL · Canvas</text></g>
<g transform="translate(360 795)" class="b d4"><polygon points="-285,0 0,-52 285,0 0,52" fill="url(#plate)" stroke="#405064"/><text y="-5" font-size="25" font-weight="750" fill="#F5F3ED">AI / LOCAL COMPUTE</text><text y="27" class="m" font-size="18" fill="#98A1AE">Python · PyTorch · ONNX · CUDA</text></g>
<g transform="translate(360 930)" class="b d5"><polygon points="-285,0 0,-52 285,0 0,52" fill="url(#plate)" stroke="#405064"/><text y="-5" font-size="25" font-weight="750" fill="#F5F3ED">AUTOMATION / TOOLS</text><text y="27" class="m" font-size="18" fill="#98A1AE">scripts · agents · workflows</text></g>
<g transform="translate(360 1065)" class="b d6"><polygon points="-285,0 0,-52 285,0 0,52" fill="url(#plate)" stroke="#405064"/><text y="-5" font-size="25" font-weight="750" fill="#F5F3ED">SECURITY / RELIABILITY</text><text y="27" class="m" font-size="18" fill="#98A1AE">testing · validation · hardening</text></g>
<g transform="translate(360 1200)" class="b"><polygon points="-285,0 0,-52 285,0 0,52" fill="url(#plate)" stroke="#405064"/><text y="-5" font-size="25" font-weight="750" fill="#F5F3ED">HARDWARE / PERFORMANCE</text><text y="27" class="m" font-size="18" fill="#98A1AE">GPU · runtime · profiling · constraints</text></g>
</g>
<circle r="5" fill="#65C7FF"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<circle r="4" fill="#D9AE57"><animateMotion dur="9s" begin="-4s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
</svg>