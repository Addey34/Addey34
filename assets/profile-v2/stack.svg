<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Core technical stack</title><desc id="desc">Animated pseudo-3D view of Adrian's core languages, product runtime, interactive engineering, data and compute stack.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#08121B"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
<path id="r1" d="M250 220C420 160 520 185 600 240S790 300 950 220"/><path id="r2" d="M250 374C430 330 510 355 600 408S790 440 950 374"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.layer{animation:f 7s ease-in-out infinite}.l2{animation-delay:-2.7s}.rail{stroke-dasharray:14 17;animation:r 6s linear infinite}@keyframes f{50%{transform:translateY(-5px)}}@keyframes r{to{stroke-dashoffset:-124}}@media(prefers-reduced-motion:reduce){.layer,.rail{animation:none!important}}</style></defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<g transform="translate(72 58)"><circle cx="7" cy="-10" r="5" fill="#D9AE57"/><text x="24" y="-5" class="m" font-size="12" fill="#D9AE57" letter-spacing="3">CORE STACK</text><text y="43" font-size="30" font-weight="760" fill="#F5F3ED">A working stack across product, runtime and delivery.</text><text y="70" font-size="14" fill="#98A1AE">Grouped by the role each technology plays in the systems I build.</text></g>
<g transform="translate(600 300)"><polygon points="-100,0 0,-53 100,0 0,53" fill="#181713" stroke="#D9AE57"/><text y="6" text-anchor="middle" font-size="22" font-weight="800" fill="#F2D58A">BUILD CORE</text></g>
<use href="#r1" fill="none" stroke="#263140" stroke-width="2"/><use href="#r1" fill="none" stroke="#168CFF" stroke-opacity=".45" class="rail"/><use href="#r2" fill="none" stroke="#263140" stroke-width="2"/><use href="#r2" fill="none" stroke="#D9AE57" stroke-opacity=".35" class="rail"/>
<g class="layer" text-anchor="middle"><g transform="translate(250 220)"><polygon points="-130,0 0,-60 130,0 0,60" fill="url(#top)" stroke="#D9AE57"/><text y="-8" class="m" font-size="10" fill="#D9AE57">LANGUAGES</text><text y="15" font-size="16" font-weight="750" fill="#F5F3ED">TypeScript · JavaScript</text><text y="36" class="m" font-size="10" fill="#8FA0B1">Python</text></g>
<g transform="translate(950 220)"><polygon points="-130,0 0,-60 130,0 0,60" fill="url(#top)" stroke="#405064"/><text y="-8" class="m" font-size="10" fill="#65C7FF">PRODUCT RUNTIME</text><text y="15" font-size="16" font-weight="750" fill="#F5F3ED">React · Node.js</text><text y="36" class="m" font-size="10" fill="#8FA0B1">Express · Vite</text></g></g>
<g class="layer l2" text-anchor="middle"><g transform="translate(250 374)"><polygon points="-140,0 0,-62 140,0 0,62" fill="url(#top)" stroke="#405064"/><text y="-8" class="m" font-size="10" fill="#65C7FF">INTERACTIVE / ENGINEERING</text><text y="15" font-size="15.5" font-weight="750" fill="#F5F3ED">Three.js · WebGL · Playwright</text><text y="36" class="m" font-size="10" fill="#8FA0B1">Canvas · Vitest · Jest · Docker</text></g>
<g transform="translate(950 374)"><polygon points="-140,0 0,-62 140,0 0,62" fill="url(#top)" stroke="#405064"/><text y="-8" class="m" font-size="10" fill="#65C7FF">DATA / COMPUTE</text><text y="15" font-size="15.5" font-weight="750" fill="#F5F3ED">MongoDB · PostgreSQL · FastAPI</text><text y="36" class="m" font-size="10" fill="#8FA0B1">PyTorch · ONNX · CUDA / DirectML</text></g></g>
<g fill="#65C7FF"><circle r="4"><animateMotion dur="5.7s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion></circle><circle r="3.4" fill="#D9AE57"><animateMotion dur="7.5s" begin="-3s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion></circle></g>
</svg>