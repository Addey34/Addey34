<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc"><title id="title">Profile signature</title><desc id="desc">Animated closing signal for Adrian Guichard's full-stack developer profile.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#09111A"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="p1" d="M120 70C320 75 400 130 540 146"/><path id="p2" d="M1080 70C880 75 800 130 660 146"/><path id="p3" d="M180 225C360 212 440 168 542 155"/><path id="p4" d="M1020 225C840 212 760 168 658 155"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.line{stroke-dasharray:14 18;animation:r 8s linear infinite}@keyframes r{to{stroke-dashoffset:-128}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.line{animation:none!important}}</style></defs>
<rect width="1200" height="285" rx="28" fill="url(#bg)"/><g fill="none" stroke="#263140"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/></g><g fill="none" stroke="#168CFF" stroke-opacity=".35" class="line"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/></g>
<g filter="url(#glow)"><circle class="motion-dot" r="3.5" fill="#65C7FF"><animateMotion dur="9.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle class="motion-dot" r="3.5" fill="#65C7FF"><animateMotion dur="8.4s" begin="-3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle class="motion-dot" r="3" fill="#D9AE57"><animateMotion dur="7.2s" begin="-2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle class="motion-dot" r="3" fill="#D9AE57"><animateMotion dur="10.8s" begin="-4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle></g>
<g transform="translate(600 150)"><polygon points="-62,0 0,-34 62,0 0,34" fill="#121923" stroke="#D9AE57"/><text y="8" text-anchor="middle" font-size="27" font-weight="800" fill="#F2D58A">AG</text></g>

<text x="600" y="235" text-anchor="middle" class="m" font-size="13" fill="#D9AE57" letter-spacing="3">FROM IDEA TO RUNNING SYSTEM.</text><text x="600" y="258" text-anchor="middle" class="m" font-size="11" fill="#7E8996" letter-spacing="2">ADRIAN GUICHARD · FULL-STACK DEVELOPER</text></svg>