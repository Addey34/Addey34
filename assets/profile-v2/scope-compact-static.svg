<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">Technical scope</title><desc id="desc">Compact technical scope across seven connected domains.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#0A1119"/></linearGradient><linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
<path id="a" d="M450 238C360 282 300 310 230 340"/><path id="b" d="M450 238C350 360 300 410 230 480"/><path id="c" d="M450 238C355 470 300 540 230 620"/><path id="d" d="M450 238C540 282 600 310 670 340"/><path id="e" d="M450 238C550 360 600 410 670 480"/><path id="f" d="M450 238C545 470 600 540 670 620"/><path id="h" d="M450 282V692"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.rail{stroke-dasharray:14 18;animation:r 8s linear infinite}.box{animation:o 7.2s ease-in-out infinite}@keyframes r{to{stroke-dashoffset:-128}}@keyframes o{0%,100%{opacity:.93}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.rail,.box{animation:none!important}}</style></defs>
<rect width="900" height="760" rx="30" fill="url(#bg)"/>
<g transform="translate(48 52)"><circle cx="7" cy="-10" r="5" fill="#D9AE57"/><text x="25" y="-4" class="m" font-size="20" fill="#D9AE57" letter-spacing="3">TECHNICAL SCOPE</text><text y="50" font-size="34" font-weight="760" fill="#F5F3ED">Multiple technical domains.</text><text y="82" font-size="20" fill="#98A1AE">Architecture, flow and constraints across the systems I build.</text></g>
<g fill="none" stroke="#263140" stroke-width="1.5"><use href="#a"/><use href="#b"/><use href="#c"/><use href="#d"/><use href="#e"/><use href="#f"/><use href="#h"/></g><g fill="none" stroke="#168CFF" stroke-opacity=".24" class="rail"><use href="#a"/><use href="#d"/><use href="#h"/></g>
<g transform="translate(450 238)"><polygon points="-105,0 0,-56 105,0 0,56" fill="#171A1C" stroke="#D9AE57"/><polygon points="-105,0 0,56 0,84 -105,28" fill="#0A0B0E" stroke="#3A3021"/><polygon points="0,56 105,0 105,28 0,84" fill="#08090B" stroke="#3A3021"/><text y="5" text-anchor="middle" font-size="28" font-weight="800" fill="#F2D58A">SYSTEMS</text><text y="32" text-anchor="middle" class="m" font-size="20" fill="#A7B0BC">ARCHITECTURE · FLOW</text></g>
<g text-anchor="middle">
<g transform="translate(230 340)" class="box"><polygon points="-170,0 0,-44 170,0 0,44" fill="url(#plate)" stroke="#405064"/><text y="-4" font-size="22" font-weight="750" fill="#F5F3ED">WEB / FULL-STACK</text><text y="26" class="m" font-size="20" fill="#98A1AE">React · Node.js · APIs · Data</text></g><g transform="translate(230 480)" class="box"><polygon points="-170,0 0,-44 170,0 0,44" fill="url(#plate)" stroke="#405064"/><text y="-4" font-size="22" font-weight="750" fill="#F5F3ED">REALTIME / GAMES</text><text y="26" class="m" font-size="20" fill="#98A1AE">WebSocket · Nakama · game loops</text></g><g transform="translate(230 620)" class="box"><polygon points="-170,0 0,-44 170,0 0,44" fill="url(#plate)" stroke="#405064"/><text y="-4" font-size="22" font-weight="750" fill="#F5F3ED">3D / GRAPHICS</text><text y="26" class="m" font-size="20" fill="#98A1AE">Three.js · WebGL · Canvas</text></g><g transform="translate(670 340)" class="box"><polygon points="-170,0 0,-44 170,0 0,44" fill="url(#plate)" stroke="#405064"/><text y="-4" font-size="22" font-weight="750" fill="#F5F3ED">AI / LOCAL COMPUTE</text><text y="26" class="m" font-size="20" fill="#98A1AE">Python · PyTorch · ONNX · CUDA</text></g><g transform="translate(670 480)" class="box"><polygon points="-170,0 0,-44 170,0 0,44" fill="url(#plate)" stroke="#405064"/><text y="-4" font-size="22" font-weight="750" fill="#F5F3ED">AUTOMATION / TOOLS</text><text y="26" class="m" font-size="20" fill="#98A1AE">scripts · agents · workflows</text></g><g transform="translate(670 620)" class="box"><polygon points="-170,0 0,-44 170,0 0,44" fill="url(#plate)" stroke="#405064"/><text y="-4" font-size="22" font-weight="750" fill="#F5F3ED">SECURITY / RELIABILITY</text><text y="26" class="m" font-size="20" fill="#98A1AE">testing · validation · hardening</text></g><g transform="translate(450 700)" class="box"><polygon points="-170,0 0,-44 170,0 0,44" fill="url(#plate)" stroke="#405064"/><text y="-4" font-size="22" font-weight="750" fill="#F5F3ED">HARDWARE / PERFORMANCE</text><text y="26" class="m" font-size="20" fill="#98A1AE">GPU · runtime · profiling · constraints</text></g>
</g>
<circle class="motion-dot" r="4" fill="#65C7FF"><animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle><circle class="motion-dot" r="3.5" fill="#D9AE57"><animateMotion dur="9.6s" begin="-4s" repeatCount="indefinite"><mpath href="#h"/></animateMotion></circle>
<style id="static-motion-override">*{animation:none!important}.motion-dot{display:none!important}</style></svg>