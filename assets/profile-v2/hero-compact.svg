<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2D58A"/><stop offset="1" stop-color="#D9AE57"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="sig" d="M510 318C585 240 770 240 826 314S760 440 655 421S526 380 510 318"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.dash{stroke-dasharray:13 18;animation:d 8s linear infinite}.pulse{animation:p 3.6s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:-124}}@keyframes p{0%,100%{opacity:.42}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.dash,.pulse{animation:none!important}}</style>
</defs>
