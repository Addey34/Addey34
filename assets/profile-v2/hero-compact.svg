<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Adrian Guichard — Full-Stack Developer</title><desc id="desc">Compact animated technical profile for intermediate GitHub layouts.</desc>
