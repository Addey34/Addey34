<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">Selected public work</title><desc id="desc">Compact public project proofs for Galaxy, Ludora and MagNotes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#0A1119"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient><path id="rail" d="M450 245V690"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.flow{stroke-dasharray:14 18;animation:r 8s linear infinite}.card{animation:o 7.2s ease-in-out infinite}@keyframes r{to{stroke-dashoffset:-128}}@keyframes o{0%,100%{opacity:.94}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.flow,.card{animation:none!important}}</style></defs>
<rect width="900" height="760" rx="30" fill="url(#bg)"/>
<g transform="translate(48 52)"><circle cx="7" cy="-10" r="5" fill="#D9AE57"/><text x="25" y="-4" class="m" font-size="20" fill="#D9AE57" letter-spacing="3">SELECTED WORK</text><text y="50" font-size="34" font-weight="760" fill="#F5F3ED">Three public projects.</text><text y="82" font-size="20" fill="#98A1AE">3D graphics · realtime platform systems · full-stack product engineering</text></g>
<use href="#rail" fill="none" stroke="#263140" stroke-width="2"/><use href="#rail" fill="none" stroke="#168CFF" stroke-opacity=".25" stroke-width="2" class="flow"/><circle class="motion-dot" r="4" fill="#65C7FF"><animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<g text-anchor="middle">
<g transform="translate(450 260)" class="card"><polygon points="-350,0 0,-68 350,0 0,68" fill="url(#top)" stroke="#405064"/><circle cy="-25" r="19" fill="none" stroke="#168CFF"/><ellipse cy="-25" rx="52" ry="19" fill="none" stroke="#405064"/><text y="18" font-size="29" font-weight="800" fill="#F5F3ED">GALAXY</text><text y="47" class="m" font-size="20" fill="#65C7FF">3D / GRAPHICS / SCIENTIFIC INTERACTION</text><text y="72" class="m" font-size="20" fill="#98A1AE">TypeScript · JavaScript · Three.js · WebGL</text></g>
<g transform="translate(450 468)" class="card"><polygon points="-350,0 0,-68 350,0 0,68" fill="url(#top)" stroke="#405064"/><g transform="translate(-54 -54)" fill="#152435" stroke="#168CFF"><rect width="28" height="28" rx="5"/><rect x="40" width="28" height="28" rx="5"/><rect x="80" width="28" height="28" rx="5"/></g><text y="18" font-size="29" font-weight="800" fill="#F5F3ED">LUDORA</text><text y="47" class="m" font-size="20" fill="#65C7FF">GAMES / REALTIME / PLATFORM SYSTEMS</text><text y="72" class="m" font-size="20" fill="#98A1AE">TypeScript · JavaScript · Three.js · Nakama · WebSocket</text></g>
<g transform="translate(450 676)" class="card"><polygon points="-350,0 0,-68 350,0 0,68" fill="url(#top)" stroke="#405064"/><g transform="translate(-42 -60) rotate(-5)"><rect width="84" height="42" rx="6" fill="#111D2A" stroke="#405064"/><path d="M12 12h54M12 22h43M12 32h50" stroke="#168CFF"/></g><text y="18" font-size="29" font-weight="800" fill="#F5F3ED">MAGNOTES</text><text y="47" class="m" font-size="20" fill="#65C7FF">PRODUCT / FULL-STACK / INTERACTION</text><text y="72" class="m" font-size="20" fill="#98A1AE">TypeScript · React · Node.js / Express · MongoDB</text></g>
</g>
</svg>