<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">Profile signature</title>
<desc id="desc">Mobile closing signal for Adrian Guichard's profile.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#09111A"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="p1" d="M70 95C170 100 240 150 305 188"/><path id="p2" d="M650 95C550 100 480 150 415 188"/><path id="p3" d="M95 315C190 300 250 245 310 222"/><path id="p4" d="M625 315C530 300 470 245 410 222"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.line{stroke-dasharray:16 20;animation:r 8s linear infinite}@keyframes r{to{stroke-dashoffset:-144}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.line{animation:none!important}}</style>
</defs>
<rect width="720" height="430" rx="32" fill="url(#bg)"/>
<g fill="none" stroke="#263140" stroke-width="2"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/></g>
<g fill="none" stroke="#168CFF" stroke-opacity=".32" stroke-width="2" class="line"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/></g>
<g filter="url(#glow)"><circle class="motion-dot" r="4" fill="#65C7FF"><animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle class="motion-dot" r="4" fill="#65C7FF"><animateMotion dur="9.6s" begin="-3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle></g>
<g transform="translate(360 205)"><polygon points="-90,0 0,-48 90,0 0,48" fill="#121923" stroke="#D9AE57"/><text y="12" text-anchor="middle" font-size="38" font-weight="800" fill="#F2D58A">AG</text></g>

<text x="360" y="352" text-anchor="middle" class="m" font-size="22" fill="#D9AE57" letter-spacing="2.5">FROM IDEA TO RUNNING SYSTEM.</text>
<text x="360" y="388" text-anchor="middle" class="m" font-size="22" fill="#7E8996" letter-spacing="1.8">ADRIAN GUICHARD · FULL-STACK DEVELOPER</text>
</svg>