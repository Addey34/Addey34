<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">Core technical stack</title><desc id="desc">Compact technical stack grouped by responsibility.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#08121B"/></linearGradient><linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18212D"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
<path id="l1" d="M450 270C370 320 310 350 230 390"/><path id="l2" d="M450 270C370 400 310 460 230 525"/><path id="l3" d="M450 270C370 505 310 585 230 660"/><path id="r1" d="M450 270C530 320 590 350 670 390"/><path id="r2" d="M450 270C530 400 590 460 670 525"/><path id="r3" d="M450 270C530 505 590 585 670 660"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.rail{stroke-dasharray:14 18;animation:r 8s linear infinite}.core{animation:f 7.2s ease-in-out infinite}@keyframes r{to{stroke-dashoffset:-128}}@keyframes f{50%{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.rail,.core{animation:none!important}}</style></defs>
<rect width="900" height="760" rx="30" fill="url(#bg)"/>
<g transform="translate(48 52)"><circle cx="7" cy="-10" r="5" fill="#D9AE57"/><text x="25" y="-4" class="m" font-size="20" fill="#D9AE57" letter-spacing="3">CORE STACK</text><text y="50" font-size="34" font-weight="760" fill="#F5F3ED">Technical stack by responsibility.</text><text y="82" font-size="20" fill="#98A1AE">Languages, runtime, graphics, data, compute and delivery.</text></g>
<g fill="none" stroke="#263140" stroke-width="1.5"><use href="#l1"/><use href="#l2"/><use href="#l3"/><use href="#r1"/><use href="#r2"/><use href="#r3"/></g><g fill="none" stroke="#168CFF" stroke-opacity=".24" class="rail"><use href="#l1"/><use href="#r2"/></g>
<g transform="translate(450 270)"><g class="core"><polygon points="-92,0 0,-50 92,0 0,50" fill="#181713" stroke="#D9AE57"/><polygon points="-92,0 0,50 0,76 -92,26" fill="#0A0B0E" stroke="#3A3021"/><polygon points="0,50 92,0 92,26 0,76" fill="#08090B" stroke="#3A3021"/><text y="7" text-anchor="middle" font-size="27" font-weight="800" fill="#F2D58A">TECH CORE</text></g></g>
<g text-anchor="middle">
<g transform="translate(230 390)"><polygon points="-170,0 0,-48 170,0 0,48" fill="url(#plate)" stroke="#405064"/><text y="-16" class="m" font-size="20" fill="#D9AE57">LANGUAGES</text><text y="12" font-size="21" font-weight="750" fill="#F5F3ED">TypeScript · JavaScript</text><text y="38" class="m" font-size="20" fill="#98A1AE">Python</text></g><g transform="translate(230 525)"><polygon points="-170,0 0,-48 170,0 0,48" fill="url(#plate)" stroke="#405064"/><text y="-16" class="m" font-size="20" fill="#65C7FF">REALTIME / GRAPHICS</text><text y="12" font-size="21" font-weight="750" fill="#F5F3ED">Three.js · WebGL</text><text y="38" class="m" font-size="20" fill="#98A1AE">WebSocket · Nakama</text></g><g transform="translate(230 660)"><polygon points="-170,0 0,-48 170,0 0,48" fill="url(#plate)" stroke="#405064"/><text y="-16" class="m" font-size="20" fill="#65C7FF">BACKEND / DATA</text><text y="12" font-size="21" font-weight="750" fill="#F5F3ED">MongoDB · PostgreSQL</text><text y="38" class="m" font-size="20" fill="#98A1AE">REST APIs · JWT / OAuth</text></g><g transform="translate(670 390)"><polygon points="-170,0 0,-48 170,0 0,48" fill="url(#plate)" stroke="#405064"/><text y="-16" class="m" font-size="20" fill="#65C7FF">PRODUCT RUNTIME</text><text y="12" font-size="21" font-weight="750" fill="#F5F3ED">React · Node.js</text><text y="38" class="m" font-size="20" fill="#98A1AE">Express · Vite</text></g><g transform="translate(670 525)"><polygon points="-170,0 0,-48 170,0 0,48" fill="url(#plate)" stroke="#405064"/><text y="-16" class="m" font-size="20" fill="#65C7FF">AI / COMPUTE</text><text y="12" font-size="21" font-weight="750" fill="#F5F3ED">FastAPI · PyTorch</text><text y="38" class="m" font-size="20" fill="#98A1AE">ONNX · CUDA / DirectML</text></g><g transform="translate(670 660)"><polygon points="-170,0 0,-48 170,0 0,48" fill="url(#plate)" stroke="#405064"/><text y="-16" class="m" font-size="20" fill="#65C7FF">DELIVERY / QA</text><text y="12" font-size="21" font-weight="750" fill="#F5F3ED">Playwright · Vitest · Jest</text><text y="38" class="m" font-size="20" fill="#98A1AE">Docker · GitHub Actions</text></g>
</g>
<circle class="motion-dot" r="4" fill="#65C7FF"><animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle><circle class="motion-dot" r="3.5" fill="#D9AE57"><animateMotion dur="9.6s" begin="-4s" repeatCount="indefinite"><mpath href="#r3"/></animateMotion></circle>
</svg>