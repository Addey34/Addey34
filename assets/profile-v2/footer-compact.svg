<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Profile signature</title><desc id="desc">Compact closing signal for Adrian Guichard's profile.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080D"/><stop offset="1" stop-color="#09111A"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="p1" d="M80 72C260 80 330 126 390 142"/><path id="p2" d="M820 72C640 80 570 126 510 142"/><path id="p3" d="M140 225C285 210 350 170 392 156"/><path id="p4" d="M760 225C615 210 550 170 508 156"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.line{stroke-dasharray:14 18;animation:r 8s linear infinite}@keyframes r{to{stroke-dashoffset:-128}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.line{animation:none!important}}</style></defs>
<rect width="900" height="300" rx="30" fill="url(#bg)"/><g fill="none" stroke="#263140"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/></g><g fill="none" stroke="#168CFF" stroke-opacity=".32" class="line"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/></g>
<g filter="url(#glow)"><circle class="motion-dot" r="3.5" fill="#65C7FF"><animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle class="motion-dot" r="3.5" fill="#65C7FF"><animateMotion dur="8.4s" begin="-3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle class="motion-dot" r="3" fill="#D9AE57"><animateMotion dur="9.6s" begin="-2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle></g>
<g transform="translate(450 150)"><polygon points="-66,0 0,-36 66,0 0,36" fill="#121923" stroke="#D9AE57"/><text y="9" text-anchor="middle" font-size="28" font-weight="800" fill="#F2D58A">AG</text></g>
<text x="450" y="240" text-anchor="middle" class="m" font-size="20" fill="#D9AE57" letter-spacing="3">FROM IDEA TO RUNNING SYSTEM.</text><text x="450" y="268" text-anchor="middle" class="m" font-size="20" fill="#7E8996" letter-spacing="1.8">ADRIAN GUICHARD · FULL-STACK DEVELOPER</text>
</svg>