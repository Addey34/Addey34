<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.f{animation:f 7s ease-in-out infinite}.p{animation:p 3.4s ease-in-out infinite}.dash{stroke-dasharray:12 16;animation:d 6s linear infinite}@keyframes f{50%{transform:translateY(-6px)}}@keyframes p{50%{opacity:1;transform:scale(1.18)}0%,100%{opacity:.5}}@keyframes d{to{stroke-dashoffset:-112}}@media(prefers-reduced-motion:reduce){.motion-dot{display:none!important}.f,.p,.dash{animation:none!important}}</style>
