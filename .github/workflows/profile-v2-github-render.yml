name: Profile V2 GitHub Render Audit
# render revision: 3

on:
  push:
    branches:
      - profile/v2-candidate
    paths:
      - ".github/workflows/profile-v2-github-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          python -m pip install --disable-pip-version-check pillow
          npx playwright install chromium --with-deps

      - name: Capture real GitHub README rendering
        run: |
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const url = 'https://github.com/Addey34/Addey34/tree/profile/v2-candidate';
            const cases = [
              { name: 'desktop', width: 1440, height: 1000 },
              { name: 'mobile', width: 390, height: 844 },
            ];
            const report = {};

            for (const c of cases) {
              const page = await browser.newPage({
                viewport: { width: c.width, height: c.height },
                deviceScaleFactor: 1,
              });
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});

              const article = page.locator('article.markdown-body').first();
              await article.waitFor({ state: 'visible', timeout: 30000 });

              report[c.name] = await article.evaluate((root) => ({
                width: root.getBoundingClientRect().width,
                images: [...root.querySelectorAll('img')].map((img) => ({
                  alt: img.alt,
                  src: img.getAttribute('src'),
                  currentSrc: img.currentSrc,
                  width: img.getBoundingClientRect().width,
                  height: img.getBoundingClientRect().height,
                })),
                sources: [...root.querySelectorAll('source')].map((source) => ({
                  media: source.media,
                  srcset: source.getAttribute('srcset'),
                  matches: source.media ? matchMedia(source.media).matches : null,
                })),
                details: [...root.querySelectorAll('details')].map((d) => ({
                  open: d.open,
                  summary: d.querySelector('summary')?.textContent?.trim() || '',
                })),
              }));

              await article.screenshot({
                path: `github-readme-${c.name}.png`,
                animations: 'disabled',
              });
              await page.close();
            }

            fs.writeFileSync('github-render-report.json', JSON.stringify(report, null, 2));
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          JS

      - name: Audit live motion behavior
        run: |
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const targets = [
            ['hero', 'Adrian Guichard — Full-Stack Developer'],
            ['scope', 'Technical scope — web, realtime, games, 3D, AI, automation, security and hardware/performance'],
            ['activity', 'Animated 3D GitHub contribution activity generated from real contribution data'],
          ];

          async function capture(browser, reduced, prefix) {
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              reducedMotion: reduced ? 'reduce' : 'no-preference',
            });
            const page = await context.newPage();
            await page.goto('https://github.com/Addey34/Addey34/tree/profile/v2-candidate', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            const article = page.locator('article.markdown-body').first();
            await article.waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForTimeout(1200);

            for (const [name, alt] of targets) {
              const img = article.locator(`img[alt="${alt}"]`).first();
              await img.waitFor({ state: 'visible', timeout: 30000 });
              await img.screenshot({ path: `${prefix}-${name}-a.png`, animations: 'allow' });
            }

            await page.waitForTimeout(2200);

            for (const [name, alt] of targets) {
              const img = article.locator(`img[alt="${alt}"]`).first();
              await img.screenshot({ path: `${prefix}-${name}-b.png`, animations: 'allow' });
            }

            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await capture(browser, false, 'motion-normal');
            await capture(browser, true, 'motion-reduced');
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          JS

          python - <<'PY'
          from PIL import Image, ImageChops
          import json

          targets = ["hero", "scope", "activity"]

          def changed_pixels(a_path, b_path, threshold=8):
              a = Image.open(a_path).convert("RGB")
              b = Image.open(b_path).convert("RGB")
              if a.size != b.size:
                  raise SystemExit(f"Size mismatch: {a_path} {a.size} vs {b_path} {b.size}")
              diff = ImageChops.difference(a, b)
              changed = sum(1 for px in diff.getdata() if max(px) > threshold)
              return changed, a.size[0] * a.size[1]

          report = {}
          for target in targets:
              normal, total = changed_pixels(
                  f"motion-normal-{target}-a.png",
                  f"motion-normal-{target}-b.png",
              )
              reduced, _ = changed_pixels(
                  f"motion-reduced-{target}-a.png",
                  f"motion-reduced-{target}-b.png",
              )
              report[target] = {
                  "total_pixels": total,
                  "normal_changed_pixels": normal,
                  "normal_changed_ratio": normal / total,
                  "reduced_changed_pixels": reduced,
                  "reduced_changed_ratio": reduced / total,
              }

          print(json.dumps(report, indent=2))
          with open("motion-report.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2)

          if sum(v["normal_changed_pixels"] for v in report.values()) < 100:
              raise SystemExit("Expected visible SVG motion in normal mode, but tested images are static.")

          reduced_total = sum(v["reduced_changed_pixels"] for v in report.values())
          if reduced_total > 30:
              raise SystemExit(
                  f"Reduced-motion surfaces still change visibly: {reduced_total} pixels."
              )
          PY

      - name: Verify reduced-motion source selection
        run: |
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            await page.goto('https://github.com/Addey34/Addey34/tree/profile/v2-candidate', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            const article = page.locator('article.markdown-body').first();
            await article.waitFor({ state: 'visible', timeout: 30000 });

            const sources = await article.locator('img').evaluateAll((imgs) =>
              imgs.map((img) => ({ alt: img.alt, currentSrc: img.currentSrc }))
            );

            fs.writeFileSync('reduced-sources.json', JSON.stringify(sources, null, 2));
            const profile = sources.filter((x) =>
              /profile-v2\//.test(x.currentSrc) || /assets\/profile-v2\//.test(x.currentSrc)
            );
            const bad = profile.filter((x) => !/-static\.svg(?:$|\?)/.test(x.currentSrc));
            if (profile.length !== 7 || bad.length) {
              console.error({ profileCount: profile.length, bad });
              process.exit(1);
            }
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          JS

      - name: Upload GitHub render audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-v2-github-render
          path: |
            github-readme-desktop.png
            github-readme-mobile.png
            github-render-report.json
            motion-report.json
            reduced-sources.json
            motion-normal-*.png
            motion-reduced-*.png
          retention-days: 3
