name: Generate profile 3D activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: profile-activity-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate AG 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Addey34
          SETTING_JSON: profile-activity/ag-dual.json

      - name: Commit generated activity
        shell: bash
        run: |
          if git diff --quiet -- profile-3d-contrib/activity-ag.svg; then
            echo "No activity changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/activity-ag.svg
          git commit -m "chore(profile): refresh 3D activity"
          git push
