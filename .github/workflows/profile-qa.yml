name: Profile QA

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - brand/**
      - .github/workflows/profile-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check brand token syntax
        run: node --check brand/brand-tokens.mjs

      - name: Validate SVG XML and accessibility metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = []
          for path in sorted(Path("assets").rglob("*.svg")):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  failures.append(f"{path}: invalid XML: {exc}")
                  continue

              ns = "{http://www.w3.org/2000/svg}"
              title = root.find(f"{ns}title")
              desc = root.find(f"{ns}desc")
              if title is None or not (title.text or "").strip():
                  failures.append(f"{path}: missing non-empty <title>")
              if desc is None or not (desc.text or "").strip():
                  failures.append(f"{path}: missing non-empty <desc>")

          if failures:
              raise SystemExit("\n".join(failures))

          print("All SVG assets are valid and include title/desc metadata.")
          PY


      - name: Validate final Signal composition readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          composed = Path("assets/brand/v83/composed")
          files = sorted(composed.glob("*.svg"))

          if not files:
              failures.append("No V8.3 composed SVG assets found.")

          for path in files:
              root = ET.parse(path).getroot()
              width = float(root.attrib.get("width", "0"))
              is_mobile = "mobile" in path.stem
              expected_width = 640 if is_mobile else 1120
              if width != expected_width:
                  failures.append(
                      f"{path}: expected width {expected_width}, got {width:g}"
                  )

              minimum = 9.0 if is_mobile else 9.5
              for elem in root.iter():
                  if not elem.tag.endswith("text"):
                      continue
                  raw = elem.attrib.get("font-size")
                  if raw is None:
                      failures.append(f"{path}: <text> missing font-size")
                      continue
                  try:
                      size = float(raw)
                  except ValueError:
                      failures.append(f"{path}: non-numeric font-size {raw!r}")
                      continue
                  if size < minimum:
                      failures.append(
                          f"{path}: font-size {size:g}px below {minimum:g}px minimum"
                      )

          readme = Path("README.md").read_text(encoding="utf-8")
          if "assets/brand/v82/" in readme:
              failures.append("README still references obsolete V8.2 assets.")
          if "<details>" in readme or re.search(r"^##?\s", readme, re.MULTILINE):
              failures.append("Visible candidate README should remain SVG-driven.")

          if failures:
              raise SystemExit("\n".join(failures))

          print(f"Validated readability and sizing for {len(files)} Signal compositions.")
          PY


      - name: Validate action semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          actions = Path("assets/brand/v83/actions")
          internal = ["about", "current", "workflow", "toolkit", "contact"]
          external = ["portfolio", "linkedin", "email"]

          def texts(path):
              root = ET.parse(path).getroot()
              return [
                  (node.text or "").strip()
                  for node in root.iter()
                  if node.tag.endswith("text")
              ]

          for name in internal:
              for suffix in [".svg", "-light.svg"]:
                  path = actions / f"{name}{suffix}"
                  root = ET.parse(path).getroot()
                  values = texts(path)
                  desc = next(
                      ((node.text or "").strip() for node in root.iter()
                       if node.tag.endswith("desc")),
                      "",
                  )
                  if name.upper() not in values:
                      failures.append(f"{path}: missing reader-facing title {name.upper()!r}")
                  if "internal Signal action" not in desc:
                      failures.append(f"{path}: internal action description is missing")

          for name in external:
              for suffix in [".svg", "-light.svg"]:
                  path = actions / f"{name}{suffix}"
                  root = ET.parse(path).getroot()
                  values = texts(path)
                  desc = next(
                      ((node.text or "").strip() for node in root.iter()
                       if node.tag.endswith("desc")),
                      "",
                  )
                  if name.upper() not in values:
                      failures.append(f"{path}: missing reader-facing title {name.upper()!r}")
                  if "external Signal action" not in desc:
                      failures.append(f"{path}: external action description is missing")

          readme = Path("README.md").read_text(encoding="utf-8")
          nav_match = re.search(
              r'<p align="center">\s*(.*?)\s*</p>',
              readme,
              re.DOTALL,
          )
          if not nav_match:
              failures.append("Could not find primary navigation block.")
          else:
              nav = nav_match.group(1)
              for anchor in ["#about", "#current", "#workflow", "#toolkit", "#contact"]:
                  if f'href="{anchor}"' not in nav:
                      failures.append(f"Primary nav missing internal anchor {anchor}")
              if "https://" in nav or "mailto:" in nav:
                  failures.append("Primary nav must not contain external actions.")

          contact_pos = readme.find('id="contact"')
          contact_asset_pos = readme.find("composed/contact.svg")
          portfolio_pos = readme.find("actions/portfolio.svg")
          linkedin_pos = readme.find("actions/linkedin.svg")
          email_pos = readme.find("actions/email.svg")
          footer_pos = readme.find("composed/footer.svg")
          positions = [
              contact_pos,
              contact_asset_pos,
              portfolio_pos,
              linkedin_pos,
              email_pos,
              footer_pos,
          ]
          if any(pos < 0 for pos in positions) or positions != sorted(positions):
              failures.append(
                  "README end sequence must be Contact → external actions → Footer."
              )

          for name in external:
              pattern = rf'actions/{name}\.svg" width="150"'
              if not re.search(pattern, readme):
                  failures.append(
                      f"External action {name} must render at the 150px system width."
                  )

          if failures:
              raise SystemExit("\n".join(failures))

          print("Internal/external Signal action semantics are coherent.")
          PY

      - name: Validate reader-facing labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          targets = [
              *sorted(Path("assets/brand/v83/composed").glob("*.svg")),
              *sorted(Path("assets/brand/v83/actions").glob("*.svg")),
          ]
          technical = re.compile(r"^(?:\d{2}(?:\s*[·↓↗].*)?|S\d+)$")

          for path in targets:
              root = ET.parse(path).getroot()
              for node in root.iter():
                  if not node.tag.endswith("text"):
                      continue
                  value = (node.text or "").strip()
                  if technical.match(value):
                      failures.append(
                          f"{path}: technical coordinate label {value!r} is reader-facing"
                      )

          if failures:
              raise SystemExit("\n".join(failures))

          print("Visible Signal labels are semantic and reader-facing.")
          PY


      - name: Validate editorial open-frame sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = []
          base = Path("assets/brand/v83/composed")
          editorial = [
              "hero.svg",
              "about.svg",
              "current.svg",
              "workflow.svg",
              "toolkit.svg",
              "more.svg",
              "hero-mobile.svg",
              "about-mobile.svg",
              "current-mobile.svg",
              "workflow-mobile.svg",
              "toolkit-mobile.svg",
              "more-mobile.svg",
          ]

          for filename in editorial:
              path = base / filename
              root = ET.parse(path).getroot()
              rects = [
                  node for node in root.iter()
                  if node.tag.endswith("rect")
              ]

              # Only the full-canvas background rect is allowed.
              if len(rects) != 1:
                  failures.append(
                      f"{path}: editorial sections must contain exactly one rect "
                      f"(canvas only), found {len(rects)}"
                  )

          if failures:
              raise SystemExit("\n".join(failures))

          print("Editorial Signal sections use open-frame geometry only.")
          PY


      - name: Validate open-frame text padding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          base = Path("assets/brand/v83/composed")
          families = ["hero", "about", "current", "toolkit", "more"]
          variants = ("", "-light", "-mobile", "-mobile-light")
          targets = [
              f"{family}{variant}.svg"
              for family in families
              for variant in variants
          ]

          frame_re = re.compile(
              r"M(?P<x>\d+(?:\.\d+)?) "
              r"(?P<top>\d+(?:\.\d+)?) "
              r"H(?P<right_top>\d+(?:\.\d+)?) "
              r"M(?P=x) "
              r"(?P<bottom>\d+(?:\.\d+)?) "
              r"H(?P<right_bottom>\d+(?:\.\d+)?) "
              r"M(?P=x) "
              r"(?P=top) "
              r"V(?P=bottom)"
          )

          for filename in targets:
              path = base / filename
              root = ET.parse(path).getroot()

              texts = []
              for node in root.iter():
                  if not node.tag.endswith("text"):
                      continue
                  try:
                      x = float(node.attrib["x"])
                      y = float(node.attrib["y"])
                  except (KeyError, ValueError):
                      continue
                  texts.append((x, y, (node.text or "").strip()))

              frames = []
              for node in root.iter():
                  if not node.tag.endswith("path"):
                      continue
                  d = node.attrib.get("d", "")
                  match = frame_re.search(d)
                  if not match:
                      continue

                  x = float(match.group("x"))
                  top = float(match.group("top"))
                  bottom = float(match.group("bottom"))
                  right = max(
                      float(match.group("right_top")),
                      float(match.group("right_bottom")),
                  )
                  frames.append((x, top, right, bottom))

              for left, top, right, bottom in frames:
                  for x, y, value in texts:
                      if not (left <= x <= right):
                          continue
                      if not (top <= y <= bottom + 16):
                          continue
                      margin = bottom - y
                      if margin < 8:
                          failures.append(
                              f"{path}: text {value!r} baseline at y={y:g} "
                              f"has only {margin:g}px bottom padding inside "
                              f"frame {top:g}-{bottom:g}"
                          )

          if failures:
              raise SystemExit("\n".join(failures))

          print("Open-frame text baselines keep at least 8px bottom padding.")
          PY

      - name: Validate text / connector clearance
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          base = Path("assets/brand/v83/composed")
          targets = sorted(base.glob("*.svg"))

          horizontal_re = re.compile(
              r"M(?P<x1>\d+(?:\.\d+)?) "
              r"(?P<y>\d+(?:\.\d+)?) "
              r"H(?P<x2>\d+(?:\.\d+)?)"
          )

          for path in targets:
              root = ET.parse(path).getroot()
              lines = []

              for node in root.iter():
                  if not node.tag.endswith("path"):
                      continue
                  for match in horizontal_re.finditer(node.attrib.get("d", "")):
                      x1 = float(match.group("x1"))
                      x2 = float(match.group("x2"))
                      y = float(match.group("y"))
                      lines.append((min(x1, x2), max(x1, x2), y))

              for node in root.iter():
                  if not node.tag.endswith("text"):
                      continue
                  try:
                      x = float(node.attrib["x"])
                      baseline = float(node.attrib["y"])
                      size = float(node.attrib["font-size"])
                  except (KeyError, ValueError):
                      continue

                  value = (node.text or "").strip()
                  glyph_top = baseline - size
                  glyph_bottom = baseline + 2

                  for left, right, line_y in lines:
                      if not (left <= x <= right):
                          continue
                      if glyph_top <= line_y <= glyph_bottom:
                          failures.append(
                              f"{path}: horizontal line y={line_y:g} crosses "
                              f"text {value!r} at baseline y={baseline:g}"
                          )

          if failures:
              raise SystemExit("\n".join(failures))

          print("Horizontal Signal connectors stay clear of text glyph bands.")
          PY

      - name: Validate README local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          refs = sorted(set(re.findall(r'(?:src|href|srcset)="(\./[^"#?]+)', readme)))
          missing = [ref for ref in refs if not Path(ref[2:]).exists()]

          external_images = [
              src for src in re.findall(r'<img[^>]+src="([^"]+)"', readme)
              if not src.startswith("./assets/")
          ]

          if missing:
              raise SystemExit("Missing local README assets:\n" + "\n".join(missing))
          if external_images:
              raise SystemExit(
                  "README images must be self-hosted:\n" + "\n".join(external_images)
              )

          print(f"Validated {len(refs)} local README references.")
          PY
