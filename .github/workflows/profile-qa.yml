          from pathlib import Path
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          refs = sorted(set(re.findall(r'(?:src|href|srcset)="(\./[^"#?]+)', readme)))
          missing = [ref for ref in refs if not Path(ref[2:]).exists()]

          external_images = [
              src for src in re.findall(r'<img[^>]+src="([^"]+)"', readme)
              if not src.startswith("./assets/")
          ]

          if missing:
              raise SystemExit("Missing local README assets:\n" + "\n".join(missing))
          if external_images:
              raise SystemExit(
                  "README images must be self-hosted:\n" + "\n".join(external_images)
              )

          print(f"Validated {len(refs)} local README references.")
          PY
