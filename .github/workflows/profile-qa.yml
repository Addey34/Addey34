name: Profile QA

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - brand/**
      - .github/workflows/profile-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check brand token syntax
        run: node --check brand/brand-tokens.mjs

      - name: Validate SVG XML and accessibility metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = []
          for path in sorted(Path("assets").rglob("*.svg")):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  failures.append(f"{path}: invalid XML: {exc}")
                  continue

              ns = "{http://www.w3.org/2000/svg}"
              title = root.find(f"{ns}title")
              desc = root.find(f"{ns}desc")
              if title is None or not (title.text or "").strip():
                  failures.append(f"{path}: missing non-empty <title>")
              if desc is None or not (desc.text or "").strip():
                  failures.append(f"{path}: missing non-empty <desc>")

          if failures:
              raise SystemExit("\n".join(failures))

          print("All SVG assets are valid and include title/desc metadata.")
          PY


      - name: Validate final Signal composition readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          composed = Path("assets/brand/v83/composed")
          files = sorted(composed.glob("*.svg"))

          if not files:
              failures.append("No V8.3 composed SVG assets found.")

          for path in files:
              root = ET.parse(path).getroot()
              width = float(root.attrib.get("width", "0"))
              is_mobile = "mobile" in path.stem
              expected_width = 640 if is_mobile else 1120
              if width != expected_width:
                  failures.append(
                      f"{path}: expected width {expected_width}, got {width:g}"
                  )

              minimum = 9.0 if is_mobile else 9.5
              for elem in root.iter():
                  if not elem.tag.endswith("text"):
                      continue
                  raw = elem.attrib.get("font-size")
                  if raw is None:
                      failures.append(f"{path}: <text> missing font-size")
                      continue
                  try:
                      size = float(raw)
                  except ValueError:
                      failures.append(f"{path}: non-numeric font-size {raw!r}")
                      continue
                  if size < minimum:
                      failures.append(
                          f"{path}: font-size {size:g}px below {minimum:g}px minimum"
                      )

          readme = Path("README.md").read_text(encoding="utf-8")
          if "assets/brand/v82/" in readme:
              failures.append("README still references obsolete V8.2 assets.")
          if "<details>" in readme or re.search(r"^##?\s", readme, re.MULTILINE):
              failures.append("Visible candidate README should remain SVG-driven.")

          if failures:
              raise SystemExit("\n".join(failures))

          print(f"Validated readability and sizing for {len(files)} Signal compositions.")
          PY


      - name: Validate Signal coordinate system
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "hero.svg": ["00 · PROFILE / IDENTITY", "01 · BUILD", "02 · PRACTICE"],
              "about.svg": ["10", "11 · ROLE", "12 · SCOPE", "13 · PATH"],
              "current.svg": ["20", "21", "22", "23", "24"],
              "workflow.svg": ["30", "31", "32", "33", "34", "35", "36", "37"],
              "toolkit.svg": ["40", "41", "42", "43", "44", "45"],
              "more.svg": ["50", "51", "52", "53"],
              "footer.svg": ["90"],
          }

          base = Path("assets/brand/v83/composed")
          failures = []

          for filename, labels in expected.items():
              path = base / filename
              root = ET.parse(path).getroot()
              texts = [
                  (node.text or "").strip()
                  for node in root.iter()
                  if node.tag.endswith("text")
              ]
              cursor = 0
              for label in labels:
                  try:
                      idx = texts.index(label, cursor)
                  except ValueError:
                      failures.append(f"{path}: missing or out-of-order label {label!r}")
                      break
                  cursor = idx + 1

          # Mobile must use the same global coordinate family.
          for filename, labels in expected.items():
              mobile = filename.replace(".svg", "-mobile.svg")
              path = base / mobile
              if not path.exists():
                  failures.append(f"{path}: missing mobile composition")
                  continue
              root = ET.parse(path).getroot()
              texts = [
                  (node.text or "").strip()
                  for node in root.iter()
                  if node.tag.endswith("text")
              ]
              # Hero mobile intentionally has no Practice panel.
              mobile_labels = labels if filename != "hero.svg" else labels[:2]
              cursor = 0
              for label in mobile_labels:
                  try:
                      idx = texts.index(label, cursor)
                  except ValueError:
                      failures.append(f"{path}: missing or out-of-order label {label!r}")
                      break
                  cursor = idx + 1

          if failures:
              raise SystemExit("\n".join(failures))

          print("Signal global coordinate system is coherent across desktop and mobile.")
          PY

      - name: Validate README local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          refs = sorted(set(re.findall(r'(?:src|href|srcset)="(\./[^"#?]+)', readme)))
          missing = [ref for ref in refs if not Path(ref[2:]).exists()]

          external_images = [
              src for src in re.findall(r'<img[^>]+src="([^"]+)"', readme)
              if not src.startswith("./assets/")
          ]

          if missing:
              raise SystemExit("Missing local README assets:\n" + "\n".join(missing))
          if external_images:
              raise SystemExit(
                  "README images must be self-hosted:\n" + "\n".join(external_images)
              )

          print(f"Validated {len(refs)} local README references.")
          PY
