          current_status = {
              "REFINING · WEB PRODUCTS & UX",
              "DEEPENING · ARCHITECTURE & APIS",
              "IMPROVING · RELIABILITY & PRODUCTION",
              "EXPLORING · REALTIME & ROBOTICS",
          }
          workflow_verbs = {
              "CLARIFY", "STRUCTURE", "IMPLEMENT", "VERIFY",
              "HARDEN", "DELIVER", "ITERATE",
          }

          for family, labels, desktop_min, mobile_min in [
              ("current", current_status, 13.5, 12.5),
              ("workflow", workflow_verbs, 13.5, 12.5),
          ]:
              for suffix in [".svg", "-light.svg", "-mobile.svg", "-mobile-light.svg"]:
                  path = base / f"{family}{suffix}"
                  mobile = "mobile" in suffix
                  minimum = mobile_min if mobile else desktop_min
                  visible = texts(root(path))
                  for label in labels:
                      node = visible.get(label)
                      if node is None:
                          failures.append(f"{path}: missing useful secondary label {label!r}")
                          continue
                      size = float(node.attrib.get("font-size", "0"))
                      if size < minimum:
                          failures.append(
                              f"{path}: {label!r} font-size {size:g}px below useful "
                              f"metadata minimum {minimum:g}px"
                          )

          for family, minimum in [("toolkit", 13.0), ("more", 13.0)]:
              for suffix in [".svg", "-light.svg", "-mobile.svg", "-mobile-light.svg"]:
                  path = base / f"{family}{suffix}"
                  for node in text_nodes(root(path)):
                      value = (node.text or "").strip()
                      if not value:
                          continue
                      # Section/module headings are already larger; inspect neutral support copy.
                      fill = node.attrib.get("fill", "")
                      if fill in {"#D2D8DF", "#343C47"}:
                          size = float(node.attrib.get("font-size", "0"))
                          if size < minimum:
                              failures.append(
                                  f"{path}: support copy {value!r} is {size:g}px, "
                                  f"below {minimum:g}px"
                              )

          if failures:
              raise SystemExit("\n".join(failures))

          print("V8.18 optical density, action alignment and readability are stable.")
