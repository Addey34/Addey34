name: Profile QA

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - brand/**
      - .github/workflows/profile-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check brand token syntax
        run: node --check brand/brand-tokens.mjs

      - name: Validate SVG XML and accessibility metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = []
          for path in sorted(Path("assets").rglob("*.svg")):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  failures.append(f"{path}: invalid XML: {exc}")
                  continue

              ns = "{http://www.w3.org/2000/svg}"
              title = root.find(f"{ns}title")
              desc = root.find(f"{ns}desc")
              if title is None or not (title.text or "").strip():
                  failures.append(f"{path}: missing non-empty <title>")
              if desc is None or not (desc.text or "").strip():
                  failures.append(f"{path}: missing non-empty <desc>")

          if failures:
              raise SystemExit("\n".join(failures))

          print("All SVG assets are valid and include title/desc metadata.")
          PY


      - name: Validate final Signal composition readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          composed = Path("assets/brand/v83/composed")
          files = sorted(composed.glob("*.svg"))

          if not files:
              failures.append("No V8.3 composed SVG assets found.")

          for path in files:
              root = ET.parse(path).getroot()
              width = float(root.attrib.get("width", "0"))
              is_mobile = "mobile" in path.stem
              expected_width = 640 if is_mobile else 1120
              if width != expected_width:
                  failures.append(
                      f"{path}: expected width {expected_width}, got {width:g}"
                  )

              minimum = 9.0 if is_mobile else 9.5
              for elem in root.iter():
                  if not elem.tag.endswith("text"):
                      continue
                  raw = elem.attrib.get("font-size")
                  if raw is None:
                      failures.append(f"{path}: <text> missing font-size")
                      continue
                  try:
                      size = float(raw)
                  except ValueError:
                      failures.append(f"{path}: non-numeric font-size {raw!r}")
                      continue
                  if size < minimum:
                      failures.append(
                          f"{path}: font-size {size:g}px below {minimum:g}px minimum"
                      )

          readme = Path("README.md").read_text(encoding="utf-8")
          if "assets/brand/v82/" in readme:
              failures.append("README still references obsolete V8.2 assets.")
          if "<details>" in readme or re.search(r"^##?\s", readme, re.MULTILINE):
              failures.append("Visible candidate README should remain SVG-driven.")

          if failures:
              raise SystemExit("\n".join(failures))

          print(f"Validated readability and sizing for {len(files)} Signal compositions.")
          PY


      - name: Validate action semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          actions = Path("assets/brand/v83/actions")
          internal = ["about", "current", "workflow", "toolkit", "contact"]
          external = ["portfolio", "linkedin", "email"]

          def texts(path):
              root = ET.parse(path).getroot()
              return [
                  (node.text or "").strip()
                  for node in root.iter()
                  if node.tag.endswith("text")
              ]

          for name in internal:
              for suffix in [".svg", "-light.svg"]:
                  path = actions / f"{name}{suffix}"
                  root = ET.parse(path).getroot()
                  values = texts(path)
                  desc = next(
                      ((node.text or "").strip() for node in root.iter()
                       if node.tag.endswith("desc")),
                      "",
                  )
                  if name.upper() not in values:
                      failures.append(f"{path}: missing reader-facing title {name.upper()!r}")
                  if "internal Signal action" not in desc:
                      failures.append(f"{path}: internal action description is missing")

          for name in external:
              for suffix in [".svg", "-light.svg"]:
                  path = actions / f"{name}{suffix}"
                  root = ET.parse(path).getroot()
                  values = texts(path)
                  desc = next(
                      ((node.text or "").strip() for node in root.iter()
                       if node.tag.endswith("desc")),
                      "",
                  )
                  if name.upper() not in values:
                      failures.append(f"{path}: missing reader-facing title {name.upper()!r}")
                  if "external Signal action" not in desc:
                      failures.append(f"{path}: external action description is missing")

          readme = Path("README.md").read_text(encoding="utf-8")
          nav_match = re.search(
              r'<p align="center">\s*(.*?)\s*</p>',
              readme,
              re.DOTALL,
          )
          if not nav_match:
              failures.append("Could not find primary navigation block.")
          else:
              nav = nav_match.group(1)
              for anchor in ["#about", "#current", "#workflow", "#toolkit", "#contact"]:
                  if f'href="{anchor}"' not in nav:
                      failures.append(f"Primary nav missing internal anchor {anchor}")
              if "https://" in nav or "mailto:" in nav:
                  failures.append("Primary nav must not contain external actions.")

          contact_pos = readme.find('id="contact"')
          contact_asset_pos = readme.find("composed/contact.svg")
          portfolio_pos = readme.find("actions/portfolio.svg")
          linkedin_pos = readme.find("actions/linkedin.svg")
          email_pos = readme.find("actions/email.svg")
          footer_pos = readme.find("composed/footer.svg")
          positions = [
              contact_pos,
              contact_asset_pos,
              portfolio_pos,
              linkedin_pos,
              email_pos,
              footer_pos,
          ]
          if any(pos < 0 for pos in positions) or positions != sorted(positions):
              failures.append(
                  "README end sequence must be Contact → external actions → Footer."
              )

          for name in external:
              pattern = rf'actions/{name}\.svg" width="150"'
              if not re.search(pattern, readme):
                  failures.append(
                      f"External action {name} must render at the 150px system width."
                  )

          if failures:
              raise SystemExit("\n".join(failures))

          print("Internal/external Signal action semantics are coherent.")
          PY

      - name: Validate reader-facing labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          targets = [
              *sorted(Path("assets/brand/v83/composed").glob("*.svg")),
              *sorted(Path("assets/brand/v83/actions").glob("*.svg")),
          ]
          technical = re.compile(r"^(?:\d{2}(?:\s*[·↓↗].*)?|S\d+)$")

          for path in targets:
              root = ET.parse(path).getroot()
              for node in root.iter():
                  if not node.tag.endswith("text"):
                      continue
                  value = (node.text or "").strip()
                  if technical.match(value):
                      failures.append(
                          f"{path}: technical coordinate label {value!r} is reader-facing"
                      )

          if failures:
              raise SystemExit("\n".join(failures))

          print("Visible Signal labels are semantic and reader-facing.")
          PY


      - name: Validate rail-aligned reader hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          failures = []
          base = Path("assets/brand/v83/composed")
          actions = Path("assets/brand/v83/actions")

          colors = {
              "dark": {"gold": "#D9AE57", "blue": "#168CFF"},
              "light": {"gold": "#9A6C17", "blue": "#006BDD"},
          }

          headers = {
              "about": ("ABOUT", "gold", 42, 40),
              "current": ("CURRENT", "blue", 42, 40),
              "workflow": ("WORKFLOW", "blue", 42, 40),
              "toolkit": ("TOOLKIT", "gold", 42, 40),
              "more": ("MORE", "blue", 42, 40),
              "contact": ("CONTACT", "blue", 42, 40),
              "footer": ("END / CONTINUE", "gold", 52, 50),
          }

          forbidden_header_copy = {
              "SELF-TAUGHT · FULL-STACK JS / TS",
              "BUILDING · LEARNING · REFINING",
              "BUILD · LEARN · REFINE",
              "IDEA → DESIGN → BUILD → TEST → SECURE → SHIP → IMPROVE",
              "IDEA → BUILD → SHIP → IMPROVE",
              "CURRENT · CURATED · MODULAR",
              "SECONDARY · STILL ACTIVE",
              "EXTERNAL CHANNELS",
              "SIGNAL SYSTEM · STILL BUILDING",
              "STILL BUILDING",
          }

          desktop_modules = {
              "about": [
                  ("ROLE", 110, 135, "gold"),
                  ("SCOPE", 110, 199, "blue"),
                  ("PATH", 110, 263, "gold"),
              ],
              "current": [
                  ("FRONTEND & INTERACTION", 110, 143, "gold"),
                  ("BACKEND & DATA", 616, 143, "blue"),
                  ("ENGINEERING & DELIVERY", 110, 279, "gold"),
                  ("REALTIME & EXPLORATION", 616, 279, "blue"),
              ],
              "workflow": [
                  ("IDEA", 134, 122, "gold"),
                  ("DESIGN", 276, 122, "gold"),
                  ("BUILD", 418, 122, "blue"),
                  ("TEST", 560, 122, "blue"),
                  ("SECURE", 702, 122, "blue"),
                  ("SHIP", 844, 122, "blue"),
                  ("IMPROVE", 986, 122, "gold"),
              ],
              "toolkit": [
                  ("FRONTEND", 110, 143, "gold"),
                  ("BACKEND & REALTIME", 616, 143, "gold"),
                  ("DATA", 110, 263, "gold"),
                  ("QUALITY & DELIVERY", 616, 263, "gold"),
                  ("AI & LOCAL TOOLING", 114, 379, "blue"),
              ],
              "more": [
                  ("WEB", 110, 141, "gold"),
                  ("CODE QUALITY", 428, 141, "gold"),
                  ("EXPLORING", 746, 141, "blue"),
              ],
          }

          mobile_modules = {
              "about": [
                  ("ROLE", 90, 137, 134, "gold"),
                  ("SCOPE", 90, 221, 218, "blue"),
                  ("PATH", 90, 305, 302, "gold"),
              ],
              "current": [
                  ("FRONTEND & INTERACTION", 92, 139, 136, "gold"),
                  ("BACKEND & DATA", 92, 269, 266, "blue"),
                  ("ENGINEERING & DELIVERY", 92, 399, 396, "gold"),
                  ("REALTIME & EXPLORATION", 92, 529, 526, "blue"),
              ],
              "toolkit": [
                  ("FRONTEND", 76, 136, 138, "gold"),
                  ("BACKEND & REALTIME", 76, 238, 240, "gold"),
                  ("DATA", 76, 340, 342, "gold"),
                  ("QUALITY & DELIVERY", 76, 442, 444, "gold"),
                  ("AI & LOCAL TOOLING", 76, 552, 560, "blue"),
              ],
              "more": [
                  ("WEB", 76, 134, 136, "gold"),
                  ("CODE QUALITY", 76, 228, 230, "gold"),
                  ("EXPLORING", 76, 312, 314, "blue"),
              ],
          }

          def nodes(path):
              root = ET.parse(path).getroot()
              return list(root.iter())

          def text_node(items, value):
              return next(
                  (
                      node for node in items
                      if node.tag.endswith("text")
                      and (node.text or "").strip() == value
                  ),
                  None,
              )

          for family, (title, accent, desktop_y, mobile_y) in headers.items():
              for suffix in [".svg", "-light.svg", "-mobile.svg", "-mobile-light.svg"]:
                  path = base / f"{family}{suffix}"
                  items = nodes(path)
                  node = text_node(items, title)
                  if node is None:
                      failures.append(f"{path}: missing header {title!r}")
                      continue

                  light = "light" in suffix
                  mobile = "mobile" in suffix
                  palette = colors["light" if light else "dark"]
                  expected_fill = palette[accent]
                  expected_y = mobile_y if mobile else desktop_y

                  if node.attrib.get("fill") != expected_fill:
                      failures.append(
                          f"{path}: {title!r} must match its rail color "
                          f"{expected_fill}, got {node.attrib.get('fill')}"
                      )
                  if float(node.attrib.get("y", "-1")) != expected_y:
                      failures.append(
                          f"{path}: {title!r} must replace the former code at "
                          f"y={expected_y}"
                      )

                  visible = {
                      (n.text or "").strip()
                      for n in items
                      if n.tag.endswith("text")
                  }
                  stale = sorted(visible & forbidden_header_copy)
                  if stale:
                      failures.append(
                          f"{path}: redundant header microcopy remains: {stale}"
                      )

          for family, module_list in desktop_modules.items():
              for suffix in [".svg", "-light.svg"]:
                  path = base / f"{family}{suffix}"
                  items = nodes(path)
                  palette = colors["light" if "light" in suffix else "dark"]
                  for title, x, y, accent in module_list:
                      node = text_node(items, title)
                      if node is None:
                          failures.append(f"{path}: missing module title {title!r}")
                          continue
                      if float(node.attrib.get("x", "-1")) != x or float(node.attrib.get("y", "-1")) != y:
                          failures.append(
                              f"{path}: {title!r} must occupy its former code position "
                              f"({x}, {y})"
                          )
                      if node.attrib.get("fill") != palette[accent]:
                          failures.append(
                              f"{path}: {title!r} must match its {accent} leader"
                          )

          for family, module_list in mobile_modules.items():
              for suffix in ["-mobile.svg", "-mobile-light.svg"]:
                  path = base / f"{family}{suffix}"
                  items = nodes(path)
                  palette = colors["light" if "light" in suffix else "dark"]

                  # One continuous global spine only; no overlapping second spine.
                  for node in items:
                      if not node.tag.endswith("path"):
                          continue
                      d = node.attrib.get("d", "")
                      if re.match(r"^M30 (?!0\b)\d+(?:\.\d+)? V\d+", d):
                          failures.append(
                              f"{path}: duplicate mobile spine segment {d!r}"
                          )

                  for title, x, y, rail_y, accent in module_list:
                      node = text_node(items, title)
                      if node is None:
                          failures.append(f"{path}: missing module title {title!r}")
                          continue
                      expected_fill = palette[accent]
                      if float(node.attrib.get("x", "-1")) != x or float(node.attrib.get("y", "-1")) != y:
                          failures.append(
                              f"{path}: {title!r} must occupy its former code position "
                              f"({x}, {y})"
                          )
                      if node.attrib.get("fill") != expected_fill:
                          failures.append(
                              f"{path}: {title!r} must match its {accent} leader"
                          )

                      circle_ok = any(
                          n.tag.endswith("circle")
                          and n.attrib.get("cx") == "30"
                          and float(n.attrib.get("cy", "-1")) == rail_y
                          and n.attrib.get("fill") == expected_fill
                          for n in items
                      )
                      path_ok = any(
                          n.tag.endswith("path")
                          and re.search(rf"\bM30 {rail_y:g} H\d+", n.attrib.get("d", ""))
                          and n.attrib.get("stroke") == expected_fill
                          for n in items
                      )
                      if not circle_ok or not path_ok:
                          failures.append(
                              f"{path}: {title!r} is not connected by one coherent "
                              f"rail/node at y={rail_y:g}"
                          )

          # External actions are one outbound blue family.
          for name in ["portfolio", "linkedin", "email"]:
              for suffix, expected_fill in [
                  (".svg", "#168CFF"),
                  ("-light.svg", "#006BDD"),
              ]:
                  path = actions / f"{name}{suffix}"
                  items = nodes(path)
                  node = text_node(items, name.upper())
                  if node is None:
                      failures.append(f"{path}: missing external action title")
                      continue
                  if node.attrib.get("fill") != expected_fill:
                      failures.append(
                          f"{path}: external action must use blue {expected_fill}"
                      )

          if failures:
              raise SystemExit("\n".join(failures))

          print("Reader-facing titles replace codes and follow coherent Signal rails.")
          PY


      - name: Validate V8.18 optical polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = []
          base = Path("assets/brand/v83/composed")

          def root(path):
              return ET.parse(path).getroot()

          def text_nodes(svg):
              return [
                  node for node in svg.iter()
                  if node.tag.endswith("text")
              ]

          def texts(svg):
              return {
                  (node.text or "").strip(): node
                  for node in text_nodes(svg)
              }

          def paths(svg):
              return {
                  node.attrib.get("d", "")
                  for node in svg.iter()
                  if node.tag.endswith("path")
              }

          def require_paths(path, expected):
              geometry = paths(root(path))
              missing = sorted(set(expected) - geometry)
              if missing:
                  failures.append(f"{path}: missing geometry {missing}")
              return geometry

          # Hero remains the V8.16 foundation: metadata is structured, not floating.
          for suffix in [".svg", "-light.svg"]:
              path = base / f"hero{suffix}"
              svg = root(path)
              visible = texts(svg)
              if "STACK" not in visible or "LOCATION" not in visible:
                  failures.append(f"{path}: missing STACK / LOCATION metadata modules")
              require_paths(
                  path,
                  ["M80 300 H960 M80 332 H960 M80 300 V332 M600 300 V332"],
              )

          for suffix in ["-mobile.svg", "-mobile-light.svg"]:
              path = base / f"hero{suffix}"
              svg = root(path)
              visible = texts(svg)
              if "STACK" not in visible or "LOCATION" not in visible:
                  failures.append(f"{path}: missing STACK / LOCATION metadata modules")
              require_paths(
                  path,
                  ["M70 352 H586 M70 426 H540 M70 352 V426"],
              )

          # Current: four independent open frames; no decorative center wiring.
          for suffix, expected_height in [
              (".svg", 394),
              ("-light.svg", 394),
              ("-mobile.svg", 646),
              ("-mobile-light.svg", 646),
          ]:
              path = base / f"current{suffix}"
              svg = root(path)
              if float(svg.attrib.get("height", "0")) != expected_height:
                  failures.append(
                      f"{path}: Current optical height must remain {expected_height}px"
                  )

          current_desktop = [
              "M72 116 H520 M72 232 H480 M72 116 V232",
              "M578 116 H1026 M578 232 H986 M578 116 V232",
              "M72 252 H520 M72 368 H480 M72 252 V368",
              "M578 252 H1026 M578 368 H986 M578 252 V368",
          ]
          current_mobile = [
              "M54 112 H586 M54 224 H536 M54 112 V224",
              "M54 242 H586 M54 354 H536 M54 242 V354",
              "M54 372 H586 M54 484 H536 M54 372 V484",
              "M54 502 H586 M54 614 H536 M54 502 V614",
          ]
          for suffix in [".svg", "-light.svg"]:
              path = base / f"current{suffix}"
              geometry = require_paths(path, current_desktop)
              forbidden = {"M560 116 V412", "M548 184 H572", "M548 344 H572"}
              stale = sorted(forbidden & geometry)
              if stale:
                  failures.append(f"{path}: decorative Current center wiring returned: {stale}")

          for suffix in ["-mobile.svg", "-mobile-light.svg"]:
              require_paths(base / f"current{suffix}", current_mobile)

          # Workflow stays a true node rail and its secondary verbs must remain readable.
          stages = [
              ("IDEA", "CLARIFY", 134),
              ("DESIGN", "STRUCTURE", 276),
              ("BUILD", "IMPLEMENT", 418),
              ("TEST", "VERIFY", 560),
              ("SECURE", "HARDEN", 702),
              ("SHIP", "DELIVER", 844),
              ("IMPROVE", "ITERATE", 986),
          ]
          for suffix in [".svg", "-light.svg"]:
              path = base / f"workflow{suffix}"
              svg = root(path)
              visible = texts(svg)
              geometry = paths(svg)
              if "M134 150 H986" not in geometry:
                  failures.append(f"{path}: Workflow rail must run endpoint-to-endpoint")
              for title, sub, x in stages:
                  for label in [title, sub]:
                      node = visible.get(label)
                      if node is None:
                          failures.append(f"{path}: missing Workflow label {label!r}")
                          continue
                      if float(node.attrib.get("x", "-1")) != x:
                          failures.append(f"{path}: {label!r} not centered on node x={x}")
                      if node.attrib.get("text-anchor") != "middle":
                          failures.append(f"{path}: {label!r} must use text-anchor=middle")
                  if f"M{x} 134 V166" not in geometry:
                      failures.append(f"{path}: Workflow tick x={x} drifted")

          mobile_stage_y = [140, 206, 272, 338, 404, 470, 536]
          for suffix in ["-mobile.svg", "-mobile-light.svg"]:
              path = base / f"workflow{suffix}"
              svg = root(path)
              visible = texts(svg)
              geometry = paths(svg)
              for node_y in mobile_stage_y:
                  if f"M78 {node_y} H110" not in geometry:
                      failures.append(f"{path}: Workflow leader y={node_y} drifted")
              if any("M104 " in d and " V" in d for d in geometry):
                  failures.append(f"{path}: legacy Workflow bracket returned")
              for title, sub, _ in stages:
                  title_node = visible.get(title)
                  sub_node = visible.get(sub)
                  if title_node is None or sub_node is None:
                      continue
                  if title_node.attrib.get("x") != "122" or sub_node.attrib.get("x") != "122":
                      failures.append(f"{path}: {title}/{sub} must share x=122")

          # Toolkit: same independent-frame grammar as Current; no center wiring.
          toolkit_desktop = [
              "M72 116 H520 M72 212 H480 M72 116 V212",
              "M578 116 H1026 M578 212 H986 M578 116 V212",
              "M72 236 H520 M72 332 H480 M72 236 V332",
              "M578 236 H1026 M578 332 H986 M578 236 V332",
              "M72 352 H1048 M72 438 H1008 M72 352 V438",
          ]
          toolkit_mobile = [
              "M54 112 H586 M54 200 H536 M54 112 V200",
              "M54 214 H586 M54 302 H536 M54 214 V302",
              "M54 316 H586 M54 404 H536 M54 316 V404",
              "M54 418 H586 M54 506 H536 M54 418 V506",
              "M54 526 H586 M54 634 H536 M54 526 V634",
          ]
          for suffix in [".svg", "-light.svg"]:
              path = base / f"toolkit{suffix}"
              geometry = require_paths(path, toolkit_desktop)
              forbidden = {
                  "M560 104 V438",
                  "M542 184 H578 M542 184 H72",
                  "M542 304 H578 M542 304 H72",
                  "M560 332 V358",
              }
              stale = sorted(forbidden & geometry)
              if stale:
                  failures.append(f"{path}: decorative Toolkit center wiring returned: {stale}")
              visible = texts(root(path))
              if "CORE" in visible or "LOCAL / CLI" in visible:
                  failures.append(f"{path}: Toolkit reintroduced redundant AI sublabels")

          for suffix in ["-mobile.svg", "-mobile-light.svg"]:
              path = base / f"toolkit{suffix}"
              require_paths(path, toolkit_mobile)
              visible = texts(root(path))
              if "CORE" in visible or "LOCAL / CLI" in visible:
                  failures.append(f"{path}: Toolkit reintroduced redundant AI sublabels")

          # More: one semantic title and three equal-width desktop modules.
          more_desktop = [
              "M72 112 H372 M72 232 H332 M72 112 V232",
              "M390 112 H690 M390 232 H650 M390 112 V232",
              "M708 112 H1008 M708 232 H968 M708 112 V232",
          ]
          for suffix in [".svg", "-light.svg"]:
              path = base / f"more{suffix}"
              require_paths(path, more_desktop)
              visible = texts(root(path))
              if "MORE" not in visible or "MORE / EXPLORATION" in visible:
                  failures.append(f"{path}: section title must be MORE")

          for suffix in ["-mobile.svg", "-mobile-light.svg"]:
              path = base / f"more{suffix}"
              visible = texts(root(path))
              if "MORE" not in visible or "MORE / EXPLORATION" in visible:
                  failures.append(f"{path}: section title must be MORE")

          # Contact labels belong to the real action buttons, not the connector SVG.
          # Branch centers are locked to the centers of the three fixed-width README actions.
          for suffix in [".svg", "-light.svg", "-mobile.svg", "-mobile-light.svg"]:
              path = base / f"contact{suffix}"
              svg = root(path)
              visible = texts(svg)
              geometry = paths(svg)
              mobile = "mobile" in suffix
