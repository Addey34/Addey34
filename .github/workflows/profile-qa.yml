              )
              if expected_branch not in geometry:
                  failures.append(
                      f"{path}: Contact branches are not centered on rendered actions"
                  )

          # Footer keeps the closing statement, mirrors action centers, and drops decorative author/year microcopy.
          for suffix in [".svg", "-light.svg", "-mobile.svg", "-mobile-light.svg"]:
              path = base / f"footer{suffix}"
