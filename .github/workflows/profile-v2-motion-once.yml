name: Profile V2 Motion Matrix Audit

on:
  push:
    branches:
      - profile/v2-candidate
    paths:
      - ".github/workflows/profile-v2-motion-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Verify responsive motion matrix
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const url = 'https://github.com/Addey34/Addey34/tree/profile/v2-candidate';
            const cases = [
              { width: 390, motion: 'no-preference', suffix: '-mobile.svg' },
              { width: 390, motion: 'reduce', suffix: '-mobile-static.svg' },
              { width: 800, motion: 'no-preference', suffix: '-compact.svg' },
              { width: 800, motion: 'reduce', suffix: '-compact-static.svg' },
              { width: 1440, motion: 'no-preference', suffix: '.svg', forbidden: ['-mobile.svg', '-compact.svg', '-static.svg'] },
              { width: 1440, motion: 'reduce', suffix: '-static.svg', forbidden: ['-mobile-static.svg', '-compact-static.svg'] },
            ];

            const failures = [];

            for (const c of cases) {
              const page = await browser.newPage({
                viewport: { width: c.width, height: 900 },
                reducedMotion: c.motion,
              });
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
              const article = page.locator('article.markdown-body').first();
              await article.waitFor({ state: 'visible', timeout: 30000 });

              const sources = await article.locator('img').evaluateAll((imgs) =>
                imgs.map((img) => img.currentSrc.split('/').pop().split('?')[0])
              );

              if (sources.length !== 7) {
                failures.push(`${c.width}/${c.motion}: expected 7 images, got ${sources.length}`);
              }

              for (const src of sources) {
                if (!src.endsWith(c.suffix)) {
                  failures.push(`${c.width}/${c.motion}: unexpected source ${src}; expected *${c.suffix}`);
                }
                for (const bad of (c.forbidden || [])) {
                  if (src.endsWith(bad)) {
                    failures.push(`${c.width}/${c.motion}: forbidden source ${src}`);
                  }
                }
              }

              console.log(c.width, c.motion, sources);
              await page.close();
            }

            await browser.close();
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          JS
