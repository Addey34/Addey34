name: Profile V2 Preview Audit

on:
  push:
    branches:
      - profile/v2-candidate
    paths:
      - "assets/profile-v2/**"
      - ".github/workflows/profile-v2-preview.yml"
  workflow_dispatch:

concurrency:
  group: profile-v2-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Render audit composites
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          import cairosvg
          from PIL import Image

          root = Path("assets/profile-v2")
          audit = Path(".audit")
          audit.mkdir(exist_ok=True)

          desktop = [
              "hero.svg",
              "scope.svg",
              "stack.svg",
              "engineering.svg",
              "selected-work.svg",
              "activity.svg",
              "footer.svg",
          ]
          mobile = [
              "hero-mobile.svg",
              "scope-mobile.svg",
              "stack-mobile.svg",
              "engineering-mobile.svg",
              "selected-work-mobile.svg",
              "activity-mobile.svg",
              "footer-mobile.svg",
          ]

          def raster(path, width):
              png = cairosvg.svg2png(url=str(path), output_width=width)
              return Image.open(BytesIO(png)).convert("RGB")

          def compose(names, width, gap, out_name):
              images = [raster(root / name, width) for name in names]
              height = sum(im.height for im in images) + gap * (len(images) - 1)
              canvas = Image.new("RGB", (width, height), "#0d1117")
              y = 0
              for im in images:
                  canvas.paste(im, (0, y))
                  y += im.height + gap
              png_path = audit / f"{out_name}.png"
              canvas.save(png_path, optimize=True)
              encoded = base64.b64encode(png_path.read_bytes()).decode("ascii")
              (audit / f"{out_name}.b64").write_text(encoded, encoding="ascii")

          compose(desktop, 900, 18, "profile-v2-desktop")
          compose(mobile, 390, 14, "profile-v2-mobile")
          PY

      - name: Upload audit previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-v2-preview
          path: |
            .audit/profile-v2-desktop.png
            .audit/profile-v2-mobile.png
          retention-days: 3
