name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches:
      - main
    paths:
      - scripts/generate-profile-stats.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate AG public telemetry
        run: node scripts/generate-profile-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed card
        run: |
          if git diff --quiet -- assets/github/telemetry.svg assets/github/telemetry-mobile.svg; then
            echo "Telemetry is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github/telemetry.svg assets/github/telemetry-mobile.svg
          git commit -m "chore(profile): refresh public telemetry"
          git push
