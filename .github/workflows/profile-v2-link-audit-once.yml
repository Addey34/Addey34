name: Profile V2 Link Audit

on:
  push:
    branches:
      - profile/v2-candidate
    paths:
      - ".github/workflows/profile-v2-link-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public destinations
        run: |
          python - <<'PY'
          import subprocess

          required = {
              "Portfolio": "https://adrianguichard.dev",
              "Galaxy": "https://galaxy.adrianguichard.dev",
              "Ludora": "https://ludora.adrianguichard.dev",
              "MagNotes": "https://magnotes.adrianguichard.dev",
          }
          optional = {
              "LinkedIn": "https://www.linkedin.com/in/adrianguichard/",
          }

          failures = []
          results = []

          def probe(name, url, required):
              cmd = [
                  "curl", "-sS", "-L",
                  "--connect-timeout", "10",
                  "--max-time", "20",
                  "-o", "/dev/null",
                  "-w", "%{http_code} %{url_effective}",
                  "-A", "Mozilla/5.0",
                  url,
              ]
              proc = subprocess.run(cmd, text=True, capture_output=True)
              output = (proc.stdout or "").strip()
              parts = output.split(" ", 1)
              code = parts[0] if parts else "000"
              effective = parts[1] if len(parts) > 1 else url
              results.append((name, url, code, effective, proc.returncode))
              if required and (proc.returncode != 0 or code == "000" or int(code) >= 400):
                  failures.append(f"{name}: HTTP {code}, curl={proc.returncode}, final={effective}")

          for name, url in required.items():
              probe(name, url, True)
          for name, url in optional.items():
              probe(name, url, False)

          for row in results:
              print(f"{row[0]} | {row[2]} | {row[3]} | curl={row[4]}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY
