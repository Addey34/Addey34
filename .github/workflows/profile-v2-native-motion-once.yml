name: Profile V2 Native Reduced Motion Audit

on:
  push:
    branches:
      - profile/v2-candidate
    paths:
      - ".github/workflows/profile-v2-native-motion-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install browser tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 pngjs@7.0.0 pixelmatch@5.3.0
          npx playwright install chromium --with-deps

      - name: Verify animated SVGs freeze natively
        run: |
          python -m http.server 8765 >/tmp/profile-v2-http.log 2>&1 &
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          const pixelmatch = require('pixelmatch');

          const assets = [
            'hero.svg','hero-compact.svg','hero-mobile.svg',
            'scope.svg','scope-compact.svg','scope-mobile.svg',
            'stack.svg','stack-compact.svg','stack-mobile.svg',
            'engineering.svg','engineering-compact.svg','engineering-mobile.svg',
            'selected-work.svg','selected-work-compact.svg','selected-work-mobile.svg',
            'activity.svg','activity-compact.svg','activity-mobile.svg',
            'footer.svg','footer-compact.svg','footer-mobile.svg',
          ];

          function diffPixels(a, b) {
            const pa = PNG.sync.read(a);
            const pb = PNG.sync.read(b);
            if (pa.width !== pb.width || pa.height !== pb.height) return Infinity;
            return pixelmatch(pa.data, pb.data, null, pa.width, pa.height, {
              threshold: 0.05,
              includeAA: false,
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            let failures = 0;
            let normalMotionAssets = 0;

            for (const asset of assets) {
              const mobile = asset.includes('-mobile');
              const compact = asset.includes('-compact');
              const viewport = mobile
                ? { width: 720, height: 1400 }
                : compact
                  ? { width: 900, height: 1200 }
                  : { width: 1200, height: 1000 };

              async function capture(reducedMotion) {
                const page = await browser.newPage({
                  viewport,
                  reducedMotion,
                  deviceScaleFactor: 1,
                });
                const url = `http://127.0.0.1:8765/assets/profile-v2/${asset}`;
                await page.goto(url, { waitUntil: 'load' });
                await page.waitForTimeout(250);
                const first = await page.screenshot({ animations: 'allow' });
                await page.waitForTimeout(1600);
                const second = await page.screenshot({ animations: 'allow' });
                await page.close();
                return diffPixels(first, second);
              }

              const reducedDiff = await capture('reduce');
              const normalDiff = await capture('no-preference');
              if (reducedDiff !== 0) failures += 1;
              if (normalDiff > 0) normalMotionAssets += 1;

              report.push({
                asset,
                reducedDiffPixels: reducedDiff,
                normalDiffPixels: normalDiff,
              });
            }

            await browser.close();
            const result = { failures, normalMotionAssets, assets: report };
            fs.writeFileSync('native-motion-report.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));

            if (failures) {
              throw new Error(`${failures} animated SVGs still move under prefers-reduced-motion`);
            }
            if (normalMotionAssets < 10) {
              throw new Error('Normal-motion control did not detect enough animated surfaces.');
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          JS

      - name: Upload native motion audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-v2-native-motion
          path: native-motion-report.json
          retention-days: 1
