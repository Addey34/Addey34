name: Profile V2 QA
# qa revision: 2

on:
  push:
    branches:
      - main
      - profile/v2-candidate
    paths:
      - README.md
      - assets/profile-v2/**
      - activity-settings/**
      - .github/workflows/profile-v2-qa.yml
      - .github/workflows/profile-v2-3d.yml
  pull_request:
    paths:
      - README.md
      - assets/profile-v2/**
      - activity-settings/**
      - .github/workflows/profile-v2-qa.yml
      - .github/workflows/profile-v2-3d.yml
  workflow_dispatch:

concurrency:
  group: profile-v2-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate V2 SVG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root_dir = Path("assets/profile-v2")
          required = {
              "hero.svg", "hero-compact.svg", "hero-mobile.svg", "hero-static.svg", "hero-compact-static.svg", "hero-mobile-static.svg",
              "scope.svg", "scope-compact.svg", "scope-mobile.svg", "scope-static.svg", "scope-compact-static.svg", "scope-mobile-static.svg",
              "stack.svg", "stack-compact.svg", "stack-mobile.svg", "stack-static.svg", "stack-compact-static.svg", "stack-mobile-static.svg",
              "engineering.svg", "engineering-compact.svg", "engineering-mobile.svg", "engineering-static.svg", "engineering-compact-static.svg", "engineering-mobile-static.svg",
              "selected-work.svg", "selected-work-compact.svg", "selected-work-mobile.svg", "selected-work-static.svg", "selected-work-compact-static.svg", "selected-work-mobile-static.svg",
              "activity.svg", "activity-compact.svg", "activity-mobile.svg", "activity-static.svg", "activity-compact-static.svg", "activity-mobile-static.svg",
              "footer.svg", "footer-compact.svg", "footer-mobile.svg", "footer-static.svg", "footer-compact-static.svg", "footer-mobile-static.svg",
          }
          svg_paths = list(root_dir.glob("*.svg"))
          found = {p.name for p in svg_paths}
          failures = []
          missing = sorted(required - found)
          unexpected = sorted(found - required)

          total_svg_bytes = sum(p.stat().st_size for p in svg_paths)
          if total_svg_bytes > 375_000:
              failures.append(
                  f"V2 SVG payload exceeds 375 KB budget: {total_svg_bytes} bytes"
              )

          if missing:
              failures.append("Missing V2 SVG assets: " + ", ".join(missing))
          if unexpected:
              failures.append("Unexpected V2 SVG assets: " + ", ".join(unexpected))

          ns = "{http://www.w3.org/2000/svg}"
          static_style = '<style id="static-motion-override">*{animation:none!important}.motion-dot{display:none!important}</style>'

          animated_names = [
              "hero.svg", "hero-compact.svg", "hero-mobile.svg",
              "scope.svg", "scope-compact.svg", "scope-mobile.svg",
              "stack.svg", "stack-compact.svg", "stack-mobile.svg",
              "engineering.svg", "engineering-compact.svg", "engineering-mobile.svg",
              "selected-work.svg", "selected-work-compact.svg", "selected-work-mobile.svg",
              "activity.svg", "activity-compact.svg", "activity-mobile.svg",
              "footer.svg", "footer-compact.svg", "footer-mobile.svg",
          ]

          def static_name(name):
              if name.endswith("-mobile.svg"):
                  return name.replace("-mobile.svg", "-mobile-static.svg")
              if name.endswith("-compact.svg"):
                  return name.replace("-compact.svg", "-compact-static.svg")
              return name.replace(".svg", "-static.svg")

          for name in animated_names:
              source = (root_dir / name).read_text(encoding="utf-8")
              expected = source.replace("</svg>", static_style + "</svg>")
              target = root_dir / static_name(name)
              if target.read_text(encoding="utf-8") != expected:
                  failures.append(f"{target}: static variant is out of sync with {name}")

          tiers = {
              "desktop": [
                  "hero.svg", "scope.svg", "stack.svg", "engineering.svg",
                  "selected-work.svg", "activity.svg", "footer.svg",
              ],
              "compact": [
                  "hero-compact.svg", "scope-compact.svg", "stack-compact.svg",
                  "engineering-compact.svg", "selected-work-compact.svg",
                  "activity-compact.svg", "footer-compact.svg",
              ],
              "mobile": [
                  "hero-mobile.svg", "scope-mobile.svg", "stack-mobile.svg",
                  "engineering-mobile.svg", "selected-work-mobile.svg",
                  "activity-mobile.svg", "footer-mobile.svg",
              ],
          }

          for tier, names in tiers.items():
              animated_bytes = sum((root_dir / name).stat().st_size for name in names)
              static_bytes = sum((root_dir / static_name(name)).stat().st_size for name in names)
              for mode, total in (("animated", animated_bytes), ("reduced-motion", static_bytes)):
                  if total > 125_000:
                      failures.append(
                          f"{tier} {mode} payload is {total} bytes; budget is 125000 bytes"
                      )

          for name in (
              "activity.svg", "activity-static.svg",
              "activity-compact.svg", "activity-compact-static.svg",
              "activity-mobile.svg", "activity-mobile-static.svg",
          ):
              size = (root_dir / name).stat().st_size
              if size > 100_000:
                  failures.append(f"{name}: {size} bytes exceeds 100 KB Activity budget")

          def walk_text_styles(node, inherited_size=None, inherited_fill=None):
              current_size = node.attrib.get("font-size", inherited_size)
              current_fill = node.attrib.get("fill", inherited_fill)
              if node.tag == f"{ns}text":
                  yield node, current_size, current_fill
              for child in node:
                  yield from walk_text_styles(child, current_size, current_fill)

          def channel(value):
              value /= 255.0
              return value / 12.92 if value <= 0.04045 else ((value + 0.055) / 1.055) ** 2.4

          def luminance(hex_color):
              value = hex_color.lstrip("#")
              r, g, b = (int(value[i:i+2], 16) for i in (0, 2, 4))
              return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b)

          def contrast_ratio(fg, bg):
              lighter, darker = sorted((luminance(fg), luminance(bg)), reverse=True)
              return (lighter + 0.05) / (darker + 0.05)

          worst_text_surface = "#18212D"

          for path in sorted(root_dir.glob("*.svg")):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  failures.append(f"{path}: invalid XML: {exc}")
                  continue

              viewbox = root.attrib.get("viewBox")
              if not viewbox:
                  failures.append(f"{path}: missing viewBox")
              else:
                  parts = viewbox.split()
                  if len(parts) != 4:
                      failures.append(f"{path}: malformed viewBox {viewbox!r}")
                  else:
                      width = float(parts[2])
                      expected_width = (
                          720.0 if "-mobile" in path.stem
                          else 900.0 if "-compact" in path.stem
                          else 1200.0
                      )
                      if width != expected_width:
                          failures.append(
                              f"{path}: expected viewBox width {expected_width:g}, got {width:g}"
                          )

              background = root.find(f"{ns}rect")
              expected_rx = "32" if "-mobile" in path.stem else ("30" if "-compact" in path.stem else "28")
              if background is None or background.attrib.get("rx") != expected_rx:
                  failures.append(f"{path}: expected outer radius {expected_rx}px")

              minimum_font = 22.0 if "-mobile" in path.stem else (20.0 if "-compact" in path.stem else 14.0)
              for text_node, raw_size, raw_fill in walk_text_styles(root):
                  if raw_size is None:
                      failures.append(f"{path}: visible <text> has no effective font-size")
                  else:
                      try:
                          size = float(raw_size)
                      except ValueError:
                          failures.append(f"{path}: non-numeric effective font-size {raw_size!r}")
                      else:
                          if size < minimum_font:
                              failures.append(
                                  f"{path}: effective font-size {size:g}px below "
                                  f"{minimum_font:g}px minimum"
                              )

                  if raw_fill and raw_fill.startswith("#") and len(raw_fill) == 7:
                      ratio = contrast_ratio(raw_fill, worst_text_surface)
                      if ratio < 4.5:
                          label = "".join(text_node.itertext()).strip()
                          failures.append(
                              f"{path}: text {label!r} uses {raw_fill} at "
                              f"{ratio:.2f}:1 against {worst_text_surface}; minimum is 4.5:1"
                          )
              title = root.find(f"{ns}title")
              desc = root.find(f"{ns}desc")
              if title is None or not (title.text or "").strip():
                  failures.append(f"{path}: missing non-empty <title>")
              if desc is None or not (desc.text or "").strip():
                  failures.append(f"{path}: missing non-empty <desc>")

              raw_original = path.read_text(encoding="utf-8")
              raw = raw_original.lower()

              for low_contrast in ("#667281", "#6F7A89"):
                  if low_contrast.lower() in raw:
                      failures.append(
                          f"{path}: low-contrast muted tone {low_contrast} is not allowed in V2"
                      )
              if any(ext in raw for ext in (".png", ".jpg", ".jpeg", ".gif")):
                  failures.append(f"{path}: raster dependency is not allowed in V2")

              if "@keyframes" in raw_original and "prefers-reduced-motion" not in raw_original:
                  failures.append(f"{path}: animated CSS must include a reduced-motion fallback")

              motion_count = raw_original.count("<animateMotion")
              if motion_count:
                  hidden_count = raw_original.count('class="motion-dot"')
                  if hidden_count < motion_count:
                      failures.append(
                          f"{path}: {motion_count} animateMotion nodes but only "
                          f"{hidden_count} reduced-motion motion-dot wrappers"
                      )
                  if ".motion-dot{display:none!important}" not in raw_original:
                      failures.append(f"{path}: animateMotion signals must hide in reduced-motion mode")

              if path.name.startswith("activity"):
                  if "<animate" in raw_original or "<animateMotion" in raw_original or "<animateTransform" in raw_original:
                      failures.append(f"{path}: generated Activity must not contain generic SMIL animation")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated {len(found)} V2 SVG assets.")
          PY

      - name: Validate V2 editorial precision
        run: |
          python - <<'PY'
          from pathlib import Path

          failures = []
          assets = {p.name: p.read_text(encoding="utf-8") for p in Path("assets/profile-v2").glob("*.svg")}
          corpus = "\n".join(assets.values()) + "\n" + Path("README.md").read_text(encoding="utf-8")

          forbidden = {
              "TS · JS": "Do not abbreviate TypeScript / JavaScript in public project stacks.",
              "Node / Express": "Use Node.js / Express.",
              "React · Node ·": "Use Node.js, not Node, in the public technical scope.",
              "ImageGeneratorLocal": "ImageGeneratorLocal must remain out of the public V2 for now.",
          }
          for needle, message in forbidden.items():
              if needle in corpus:
                  failures.append(f"{message} Found: {needle!r}")

          required = {
              "hero.svg": ["FULL-STACK DEVELOPER", "hardware"],
              "hero-compact.svg": ["FULL-STACK DEVELOPER", "hardware"],
              "hero-mobile.svg": ["FULL-STACK DEVELOPER", "hardware"],
              "scope.svg": ["React · Node.js · APIs · Data", "ARCHITECTURE / FLOW / CONSTRAINTS"],
              "scope-compact.svg": ["React · Node.js · APIs · Data", "ARCHITECTURE · FLOW"],
              "scope-mobile.svg": ["React · Node.js · APIs · Data", "ARCHITECTURE · FLOW", "CONSTRAINTS"],
              "selected-work.svg": [
                  "TypeScript · JavaScript",
                  "TypeScript · React · Node.js",
                  "Nakama · WebSocket",
              ],
              "selected-work-compact.svg": [
                  "TypeScript · JavaScript · Three.js · WebGL",
                  "TypeScript · JavaScript · Three.js · Nakama · WebSocket",
                  "TypeScript · React · Node.js / Express · MongoDB",
              ],
              "selected-work-mobile.svg": [
                  "TypeScript · JavaScript · Three.js",
                  "Nakama · WebSocket",
                  "TypeScript · React · Node.js",
                  "Express · MongoDB",
              ],
              "footer.svg": ["FULL-STACK DEVELOPER"],
              "footer-compact.svg": ["FULL-STACK DEVELOPER"],
              "footer-mobile.svg": ["FULL-STACK DEVELOPER"],
          }
          for filename, needles in required.items():
              raw = assets[filename]
              for needle in needles:
                  if needle not in raw:
                      failures.append(f"{filename}: missing required wording {needle!r}")

          if failures:
              raise SystemExit("\n".join(failures))
          print("V2 editorial precision guardrails are valid.")
          PY

      - name: Validate activity generator guardrails
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          failures = []
          settings = json.loads(Path("activity-settings/ag.json").read_text(encoding="utf-8"))
          if settings.get("growingAnimation") is not False:
              failures.append("Activity cube growth must remain disabled; motion belongs to the curated wrapper.")

          workflow = Path(".github/workflows/profile-v2-3d.yml").read_text(encoding="utf-8")
          if "@latest" in workflow:
              failures.append("Profile V2 third-party Actions must be pinned, not use @latest.")
          if "github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586" not in workflow:
              failures.append("Unexpected github-profile-3d-contrib revision.")
          if 'github-actions[bot]' not in workflow:
              failures.append("Activity commits must use the GitHub Actions bot identity.")
          if "activity-compact.svg" not in workflow or "activity-compact-static.svg" not in workflow:
              failures.append("Activity workflow must generate compact animated/static surfaces.")
          if "group: profile-v2-activity-" not in workflow or "cancel-in-progress: true" not in workflow:
              failures.append("Activity workflow must serialize runs per ref.")
          if "- main" not in workflow:
              failures.append("Activity workflow must remain ready for the main branch.")

          if failures:
              raise SystemExit("\n".join(failures))
          print("Activity generator guardrails are valid.")
          PY

      - name: Validate V2 README
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          failures = []

          for anchor in ["#scope", "#stack", "#work", "#activity"]:
              if f'href="{anchor}"' not in readme:
                  failures.append(f"README missing navigation anchor {anchor}")

          for section_id in ["scope", "stack", "engineering", "work", "activity", "contact"]:
              if f'<a id="{section_id}"></a>' not in readme:
                  failures.append(f"README missing section id {section_id}")

          expected_assets = [
              "./assets/profile-v2/hero.svg",
              "./assets/profile-v2/scope.svg",
              "./assets/profile-v2/stack.svg",
              "./assets/profile-v2/engineering.svg",
              "./assets/profile-v2/selected-work.svg",
              "./assets/profile-v2/activity.svg",
              "./assets/profile-v2/footer.svg",
          ]
          for asset in expected_assets:
              if asset not in readme:
                  failures.append(f"README missing V2 asset {asset}")

          if "assets/brand/v83/" in readme:
              failures.append("README still references V83 visual assets")
          if "FULL-STACK DEVELOPER" not in Path("assets/profile-v2/hero.svg").read_text(encoding="utf-8"):
              failures.append("Hero role must remain FULL-STACK DEVELOPER")
          if "Python" not in readme:
              failures.append("README must retain Python in the technical profile")
          if "ImageGeneratorLocal" in readme:
              failures.append("ImageGeneratorLocal must stay out of the public showcase for now")

          for obsolete in ('(max-width: 640px)', '(max-width: 768px)', '(max-width: 1280px)'):
              if obsolete in readme:
                  failures.append(f"README still uses obsolete responsive breakpoint {obsolete}")
          if readme.count('(max-width: 430px)') != 14:
              failures.append("All seven surfaces must expose mobile animated/reduced-motion sources")
          if readme.count('(max-width: 1240px)') != 14:
              failures.append("All seven surfaces must expose compact animated/reduced-motion sources")
          if 'href="#contact"' in readme:
              failures.append("Top navigation should stay compact; Contact remains a section, not a nav item.")
          if '<a href="https://github.com/Addey34"><strong>GitHub</strong></a>' in readme:
              failures.append("Contact block should not repeat the current GitHub profile link.")
          if readme.count('(prefers-reduced-motion: reduce)') != 21:
              failures.append("All seven surfaces must expose reduced-motion mobile/compact/desktop sources")

          sources = (
              re.findall(r'<img[^>]+src="([^"]+)"', readme)
              + re.findall(r'<source[^>]+srcset="([^"]+)"', readme)
          )
          for src in sources:
              if not src.startswith("./assets/profile-v2/"):
                  failures.append(f"README image is not a V2 self-hosted asset: {src}")
              if src.lower().endswith((".png", ".jpg", ".jpeg", ".gif")):
                  failures.append(f"Raster README image is not allowed: {src}")

          refs = sorted(set(
              re.findall(r'(?:src|href)="(\./[^"#?]+)', readme)
              + re.findall(r'srcset="(\./[^"#?]+)', readme)
          ))
          missing = [ref for ref in refs if not Path(ref[2:]).exists()]
          if missing:
              failures.append("Missing local README assets: " + ", ".join(missing))

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"README guardrails valid; {len(refs)} local references resolved.")
          PY
