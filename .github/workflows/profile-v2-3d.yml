name: Profile V2 3D Activity

on:
  push:
    branches:
      - main
      - profile/v2-candidate
    paths:
      - ".github/workflows/profile-v2-3d.yml"
      - "activity-settings/ag.json"
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

concurrency:
  group: profile-v2-activity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Generate 3D contribution activity
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: activity-settings/ag.json

      - name: Build curated activity surfaces
        run: |
          python - <<'PY'
          import copy
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          NS = "http://www.w3.org/2000/svg"
          ET.register_namespace("", NS)
          q = lambda tag: f"{{{NS}}}{tag}"

          source = Path("profile-3d-contrib/activity-ag.svg")
          root = ET.parse(source).getroot()
          children = list(root)

          if len(children) < 3:
              raise SystemExit("Unexpected 3D activity SVG structure")

          style = copy.deepcopy(children[0])
          calendar = copy.deepcopy(children[2])

          def text(parent, x, y, value, size, fill, *, mono=False, weight=None, spacing=None):
              attrs = {
                  "x": str(x), "y": str(y), "fill": fill,
                  "font-size": str(size),
                  "font-family": "Consolas, monospace" if mono else "Inter, Segoe UI, Arial, sans-serif",
              }
              if weight:
                  attrs["font-weight"] = str(weight)
              if spacing:
                  attrs["letter-spacing"] = str(spacing)
              node = ET.SubElement(parent, q("text"), attrs)
              node.text = value

          def build(path, width, height, tx, ty, scale, mobile=False, compact=False, min_calendar_x=None):
              out = ET.Element(q("svg"), {
                  "width": str(width), "height": str(height),
                  "viewBox": f"0 0 {width} {height}",
                  "role": "img", "aria-labelledby": "title desc",
              })
              title = ET.SubElement(out, q("title"), {"id": "title"})
              title.text = "GitHub contribution activity"
              desc = ET.SubElement(out, q("desc"), {"id": "desc"})
              desc.text = "3D GitHub contribution activity generated from real contribution data."

              out.append(copy.deepcopy(style))
              motion_style = ET.SubElement(out, q("style"))
              motion_style.text = (
                  ".activity-flow{stroke-dasharray:14 20;animation:activityFlow 8s linear infinite}"
                  "@keyframes activityFlow{to{stroke-dashoffset:-136}}"
                  "@media(prefers-reduced-motion:reduce){.activity-flow{animation:none!important;stroke-opacity:.12}}"
              )

              ET.SubElement(out, q("rect"), {
                  "width": str(width), "height": str(height),
                  "rx": "32" if mobile else ("30" if compact else "28"),
                  "fill": "#06080D",
              })

              hx = 54 if mobile else (48 if compact else 72)
              hy = 60 if mobile else (52 if compact else 58)
              header = ET.SubElement(out, q("g"), {"transform": f"translate({hx} {hy})"})
              ET.SubElement(header, q("circle"), {
                  "cx": "7", "cy": "-12", "r": "6" if mobile else "5", "fill": "#D9AE57"
              })
              text(header, 26 if mobile else 24, -5, "ACTIVITY / 3D CONTRIBUTIONS", 22 if mobile else (20 if compact else 14), "#D9AE57", mono=True, spacing=3)
              text(header, 0, 54 if mobile else (50 if compact else 43), "Recent contribution activity in 3D.", 28 if mobile else (32 if compact else 30), "#F5F3ED", weight=760)
              text(header, 0, 91 if mobile else (82 if compact else 70), "Generated from real GitHub contribution data.", 22 if mobile else (20 if compact else 15), "#98A1AE")

              flow_d = (
                  "M60 540 C220 500 500 555 660 510"
                  if mobile else (
                      "M80 448 C250 418 620 470 820 430"
                      if compact else
                      "M120 548 C360 500 760 565 1080 510"
                  )
              )
              ET.SubElement(out, q("path"), {
                  "d": flow_d,
                  "fill": "none",
                  "stroke": "#65C7FF",
                  "stroke-width": "2",
                  "stroke-opacity": ".28",
                  "class": "activity-flow",
              })

              cal = copy.deepcopy(calendar)
              if min_calendar_x is not None:
                  for child in list(cal):
                      match = re.match(
                          r"translate\(([-\d.]+)[ ,]+([-\d.]+)\)",
                          child.attrib.get("transform", ""),
                      )
                      if match and float(match.group(1)) < min_calendar_x:
                          cal.remove(child)

              cal.set("transform", f"translate({tx} {ty}) scale({scale})")
              out.append(cal)
              ET.ElementTree(out).write(path, encoding="unicode")

          build(
              "assets/profile-v2/activity.svg",
              1200, 590, -314, -269, 1.05,
              min_calendar_x=560,
          )
          build(
              "assets/profile-v2/activity-compact.svg",
              900, 500, -358, -238, 0.90,
              compact=True,
              min_calendar_x=620,
          )
          build(
              "assets/profile-v2/activity-mobile.svg",
              720, 590, -785, -359, 1.15,
              mobile=True,
              min_calendar_x=650,
          )

          static_style = '<style id="static-motion-override">*{animation:none!important}.motion-dot{display:none!important}</style>'

          def freeze(source, target):
              raw = Path(source).read_text(encoding="utf-8")
              Path(target).write_text(
                  raw.replace("</svg>", static_style + "</svg>"),
                  encoding="utf-8",
              )

          freeze("assets/profile-v2/activity.svg", "assets/profile-v2/activity-static.svg")
          freeze("assets/profile-v2/activity-compact.svg", "assets/profile-v2/activity-compact-static.svg")
          freeze("assets/profile-v2/activity-mobile.svg", "assets/profile-v2/activity-mobile-static.svg")
          PY

      - name: Validate curated activity surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          NS = "{http://www.w3.org/2000/svg}"
          failures = []

          for filename, width, radius, min_font in (
              ("assets/profile-v2/activity.svg", 1200, "28", 14.0),
              ("assets/profile-v2/activity-static.svg", 1200, "28", 14.0),
              ("assets/profile-v2/activity-compact.svg", 900, "30", 20.0),
              ("assets/profile-v2/activity-compact-static.svg", 900, "30", 20.0),
              ("assets/profile-v2/activity-mobile.svg", 720, "32", 22.0),
              ("assets/profile-v2/activity-mobile-static.svg", 720, "32", 22.0),
          ):
              path = Path(filename)
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  failures.append(f"{filename}: invalid XML: {exc}")
                  continue

              viewbox = root.attrib.get("viewBox", "").split()
              if len(viewbox) != 4 or float(viewbox[2]) != width:
                  failures.append(f"{filename}: unexpected viewBox")

              background = root.find(f"{NS}rect")
              if background is None or background.attrib.get("rx") != radius:
                  failures.append(f"{filename}: unexpected outer radius")

              raw = path.read_text(encoding="utf-8")
              if "<animate" in raw or "<animateMotion" in raw or "<animateTransform" in raw:
                  failures.append(f"{filename}: generic SMIL animation leaked into curated output")
              if "prefers-reduced-motion" not in raw:
                  failures.append(f"{filename}: reduced-motion fallback missing")
              if "mobile" in filename and path.stat().st_size > 100_000:
                  failures.append(
                      f"{filename}: mobile activity exceeds 100 KB ({path.stat().st_size} bytes)"
                  )

              for match in re.finditer(r'font-size="([\d.]+)"', raw):
                  if float(match.group(1)) < min_font:
                      failures.append(
                          f"{filename}: font-size {match.group(1)} below {min_font:g}px minimum"
                      )

          if failures:
              raise SystemExit("\n".join(failures))
          print("Curated activity surfaces validated.")
          PY

      - name: Commit curated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-v2/activity.svg assets/profile-v2/activity-static.svg assets/profile-v2/activity-compact.svg assets/profile-v2/activity-compact-static.svg assets/profile-v2/activity-mobile.svg assets/profile-v2/activity-mobile-static.svg
          if git commit -m "chore(profile): refresh 3D activity"; then
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              echo "Push raced with another update; retrying ($attempt/3)..."
              sleep 2
            done
            echo "Unable to publish refreshed activity after 3 retries."
            exit 1
          fi
