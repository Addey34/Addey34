name: Profile 3D Activity

on:
  push:
    branches:
      - profile/modular-card-exploration
    paths:
      - ".github/workflows/profile-3d.yml"
      - "activity-settings/ag.json"
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate 3D contribution activity
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: activity-settings/ag.json

      - name: Keep only the 3D contribution surface
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "profile-3d-contrib/activity-ag.svg"
          ET.register_namespace("", "http://www.w3.org/2000/svg")
          tree = ET.parse(path)
          root = tree.getroot()
          children = list(root)

          # Generated layout: style, background, 3D calendar, radar, languages, counters.
          # Keep only the visual system we actually want to expose.
          for child in children[3:]:
              root.remove(child)

          root.set("width", "1280")
          root.set("height", "700")
          root.set("viewBox", "0 120 1280 700")
          tree.write(path, encoding="unicode")
          PY

      - name: Commit generated activity
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/activity-ag.svg
          if git commit -m "chore(profile): refresh 3D activity"; then
            git push
          fi
